name: Factory Production Settings Frontend Migration

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Production Settings architecture and security contracts
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_factory_production_settings_frontend_architecture \
            almdina_erp.tests.test_factory_production_settings_frontend_security \
            almdina_erp.tests.test_page_revisit_refresh_contract \
            almdina_erp.tests.test_whatsapp_frontend_contracts \
            almdina_erp.tests.test_whatsapp_settings_capability_migration \
            almdina_erp.tests.test_whatsapp_message_templates \
            almdina_erp.tests.test_whatsapp_phone \
            almdina_erp.tests.test_whatsapp_session_policy \
            almdina_erp.tests.test_whatsapp_application \
            almdina_erp.tests.test_whatsapp_config \
            almdina_erp.tests.test_whatsapp_openwa_client \
            almdina_erp.tests.test_whatsapp_pdf_adapter \
            almdina_erp.tests.test_measurements_print_document

      - name: Validate Production Settings JavaScript syntax
        run: |
          node --check almdina_erp/almdina_erp/page/factory_production_settings/factory_production_settings.js
          node --check almdina_erp/public/js/factory_production_settings/api.js
          node --check almdina_erp/public/js/factory_production_settings/state.js
          node --check almdina_erp/public/js/factory_production_settings/view_model.js
          node --check almdina_erp/public/js/factory_production_settings/renderer.js
          node --check almdina_erp/public/js/factory_production_settings/interactions.js
          node --check almdina_erp/public/js/factory_production_settings/dialogs.js
          node --check almdina_erp/public/js/factory_production_settings/whatsapp_panel.js
          node --check almdina_erp/public/js/factory_production_settings/controller.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/door_cutting_order_whatsapp_delivery_ux.js

      - name: Run Production Settings view-model simulation
        run: |
          node almdina_erp/tests/js/factory_production_settings_view_model.test.js
          node almdina_erp/tests/js/whatsapp_delivery.test.js

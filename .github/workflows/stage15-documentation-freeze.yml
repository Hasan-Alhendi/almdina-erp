name: Stage 15 Documentation Freeze

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical documentation contract
        run: python -m unittest -v almdina_erp.tests.test_stage15_documentation_contract

      - name: Re-run architecture freeze boundaries
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates

      - name: Re-run connected factory journey
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_stage14_preproduction_regression \
            almdina_erp.tests.test_stage14_end_to_end_regression

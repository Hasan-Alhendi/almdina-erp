name: Door Drawing V3 Checks

on:
  push:
    branches:
      - Develop
    paths:
      - "almdina_erp/public/js/door_drawing_v3/**"
      - "almdina_erp/public/css/door_drawing_v3*.css"
      - "almdina_erp/tests/js/door_drawing_v3_*.test.js"
      - ".github/workflows/door-drawing-v3-checks.yml"
  pull_request:
    paths:
      - "almdina_erp/public/js/door_drawing_v3/**"
      - "almdina_erp/public/css/door_drawing_v3*.css"
      - "almdina_erp/tests/js/door_drawing_v3_*.test.js"
      - ".github/workflows/door-drawing-v3-checks.yml"

permissions:
  contents: read

jobs:
  drawing-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Door Drawing V3 JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find almdina_erp/public/js/door_drawing_v3 -type f -name '*.js' -print0)

      - name: Run Door Drawing V3 regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(almdina_erp/tests/js/door_drawing_v3_*.test.js)
          if (( ${#tests[@]} == 0 )); then
            echo "No Door Drawing V3 regression tests found" >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "==> $test_file"
            node "$test_file"
          done

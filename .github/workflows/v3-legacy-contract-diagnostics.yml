name: V3 Legacy Contract Diagnostics

on:
  pull_request:
    branches: [Develop, develop, main]

permissions:
  contents: read

jobs:
  diagnose-v3-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run every V3 legacy regression and annotate failures
        shell: bash
        run: |
          set +e
          failures=0
          for test_file in almdina_erp/tests/js/door_drawing_v3_*.test.js; do
            echo "Running ${test_file}"
            node "${test_file}"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error file=${test_file}::V3 legacy regression failed with exit code ${status}"
              failures=$((failures + 1))
            fi
          done
          echo "V3 legacy failures: ${failures}"
          exit "$failures"

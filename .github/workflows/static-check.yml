name: Static baseline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optimizer test dependency
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'ortools>=9.15,<10'

      - name: Validate JSON and Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
          print(f'Validated {len(files)} JSON files')
          PY
          python -m compileall -q almdina_erp

      # Keep this release-only workflow intentionally small and stable.
      # The comprehensive Python/frontend/security regressions are owned by the
      # dedicated "Static Checks" and other required workflows that run on the
      # same pull request. Duplicating a hand-maintained module list here caused
      # this gate to drift after refactors while the canonical suites stayed green.
      - name: Validate advanced cutting optimizer smoke baseline
        shell: bash
        run: |
          python - <<'PY'
          from almdina_erp.tests import test_advanced_cutting_optimizer as checks

          tests = [
              getattr(checks, name)
              for name in dir(checks)
              if name.startswith('test_') and callable(getattr(checks, name))
          ]
          for test in tests:
              print(f'Running {test.__name__}...')
              test()
          print(f'Validated {len(tests)} advanced optimizer regression checks')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find almdina_erp -type f -name '*.js' -print0)
          echo "Validated ${count} JavaScript files"

      - name: Validate special-shape exact geometry
        shell: bash
        run: |
          node almdina_erp/tests/test_special_shape_geometry.js
          node almdina_erp/tests/js/shape_output_contract.test.js

      - name: Validate printable door drawings
        shell: bash
        run: |
          node almdina_erp/tests/test_shape_print.js

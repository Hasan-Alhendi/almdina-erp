name: Static baseline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optimizer test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check '.[test]'

      - name: Validate JSON and Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
          print(f'Validated {len(files)} JSON files')
          PY
          python -m compileall -q almdina_erp

      # Run the existing optimizer regressions through pytest so parametrized
      # cases and fixtures are executed with their declared contracts.
      - name: Validate advanced cutting optimizer smoke baseline
        shell: bash
        run: python -m pytest -q almdina_erp/tests/test_advanced_cutting_optimizer.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find almdina_erp -type f -name '*.js' -print0)
          echo "Validated ${count} JavaScript files"

      - name: Validate special-shape exact geometry
        shell: bash
        run: |
          node almdina_erp/tests/test_special_shape_geometry.js
          node almdina_erp/tests/js/shape_output_contract.test.js

      - name: Validate printable door drawings
        shell: bash
        run: |
          node almdina_erp/tests/test_shape_print.js

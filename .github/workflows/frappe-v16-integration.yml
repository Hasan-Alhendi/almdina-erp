name: Frappe v16 Integration

on:
  workflow_dispatch:
    inputs:
      frappe_ref:
        description: Frappe tag or branch to certify
        required: true
        default: v16.17.5
        type: string
      erpnext_ref:
        description: ERPNext tag or branch to certify
        required: true
        default: v16.17.0
        type: string
      desk_only:
        description: Skip the full Python suite and run only real Desk certification
        required: false
        default: false
        type: boolean
      new_form_smoke_only:
        description: Run only the bounded login and NEW DCO form-load smoke
        required: false
        default: false
        type: boolean
      new_customer_field_smoke_only:
        description: Run NEW form-load and interactive Customer field smoke without Recovery
        required: false
        default: false
        type: boolean
      phase_a_comparison_only:
        description: Compare standard form, Desk list navigation, direct DCO route, and DCO services
        required: false
        default: false
        type: boolean
      phase_a_comparison_case:
        description: Run all Phase A comparisons, B only, or B and C after focused fixes
        required: false
        default: all
        type: choice
        options:
          - all
          - B
          - B_C
      new_local_gate_only:
        description: Run only real Desk NEW recovery, hydration and official Save
        required: false
        default: false
        type: boolean
      new_stress_only:
        description: Run the independent 200–500-piece NEW Recovery Stress/Performance path
        required: false
        default: false
        type: boolean
      new_stress_piece_count:
        description: Piece count for NEW Recovery Stress/Performance
        required: false
        default: '200'
        type: choice
        options:
          - '200'
          - '500'
  pull_request:
    paths:
      - "almdina_erp/**"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - ".github/workflows/frappe-v16-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout Almdina ERP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mariadb-client \
            libmariadb-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            wkhtmltopdf \
            xvfb \
            redis-tools
          sudo npm install -g yarn

      - name: Install Bench CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade frappe-bench

      - name: Verify Frappe v16 toolchain
        run: |
          set -euo pipefail
          python --version
          node --version
          yarn --version
          mariadb --version
          bench --version
          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"Expected Python 3.14, got {sys.version}")
          PY
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 24) { throw new Error(`Expected Node 24+, got ${process.version}`); }'
          mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent
          redis-cli -h 127.0.0.1 -p 13000 ping | grep -qx PONG
          redis-cli -h 127.0.0.1 -p 11000 ping | grep -qx PONG

      - name: Initialize Frappe v16 bench
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || 'v16.17.5' }}
        run: |
          bench init "$RUNNER_TEMP/frappe-bench" \
            --frappe-branch "$FRAPPE_REF" \
            --python python3.14 \
            --skip-redis-config-generation

      - name: Install ERPNext v16 and local app source
        env:
          APP_SOURCE: ${{ github.workspace }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'v16.17.0' }}
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench get-app erpnext --branch "$ERPNEXT_REF"
          git clone "$APP_SOURCE" apps/almdina_erp
          ./env/bin/pip install -e 'apps/almdina_erp[test]'
          python - <<'PY'
          from pathlib import Path

          apps_path = Path("sites/apps.txt")
          apps = [
              line.strip()
              for line in apps_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if "almdina_erp" not in apps:
              apps.append("almdina_erp")
          apps_path.write_text("\n".join(apps) + "\n", encoding="utf-8")
          PY

      - name: Record and verify application source refs
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || 'v16.17.5' }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'v16.17.0' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          FRAPPE_SHA="$(git -C apps/frappe rev-parse HEAD)"
          ERPNEXT_SHA="$(git -C apps/erpnext rev-parse HEAD)"
          printf 'Frappe ref=%s sha=%s\nERPNext ref=%s sha=%s\n' \
            "$FRAPPE_REF" "$FRAPPE_SHA" "$ERPNEXT_REF" "$ERPNEXT_SHA"
          if [[ "$FRAPPE_REF" == "v16.17.5" ]]; then
            test "$FRAPPE_SHA" = "75baafaa0bde07a86bf28764383b93b5df97bc7e"
          fi
          if [[ "$ERPNEXT_REF" == "v16.17.0" ]]; then
            test "$ERPNEXT_SHA" = "7b494dc9e8e47d288de5427bae25ce8a52c37d96"
          fi

      - name: Configure Redis URLs
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Create integration site
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench new-site test.localhost \
            --db-host 127.0.0.1 \
            --db-root-username root \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket \
            --verbose 2>&1 | tee "$RUNNER_TEMP/new-site.log"

      - name: Install ERPNext and Almdina ERP
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost install-app erpnext 2>&1 | tee "$RUNNER_TEMP/install-erpnext.log"
          bench --site test.localhost install-app almdina_erp 2>&1 | tee "$RUNNER_TEMP/install-almdina.log"

      - name: Run migrate twice for idempotency
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.seed_retired_standard_pages
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.seed_retired_standard_reports
          bench --site test.localhost migrate 2>&1 | tee "$RUNNER_TEMP/migrate-first.log"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent
          bench --site test.localhost migrate 2>&1 | tee "$RUNNER_TEMP/migrate-second.log"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent

      - name: Verify installed apps and schema
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost list-apps
          bench --site test.localhost execute frappe.get_all --kwargs '{"doctype":"DocType","filters":{"module":"Almdina ERP"},"pluck":"name"}'

      - name: Run Almdina ERP tests
        if: github.event_name != 'workflow_dispatch' || (inputs.desk_only != true && inputs.new_form_smoke_only != true && inputs.new_customer_field_smoke_only != true && inputs.phase_a_comparison_only != true && inputs.phase_a_comparison_case != 'B' && inputs.phase_a_comparison_case != 'B_C' && inputs.new_local_gate_only != true && inputs.new_stress_only != true)
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost set-config allow_tests true
          set +e
          bench --site test.localhost run-tests --app almdina_erp 2>&1 | tee "$RUNNER_TEMP/tests.log"
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            failure_tail="$(python - "$RUNNER_TEMP/tests.log" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          lines = text.splitlines()
          pattern = re.compile(r"(?i)(?:\bFAILED\b|\bFAIL\b|\bERROR\b|Traceback|AssertionError|Exception|Ran \d+ tests)")
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 1), min(len(lines), index + 2)))
          print("\n".join(lines[index] for index in sorted(selected)[-120:]))
          PY
          )"
            if [[ -z "$failure_tail" ]]; then
              failure_tail="$(tail -n 100 "$RUNNER_TEMP/tests.log")"
            fi
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            printf '::error title=Frappe test output::%s\n' "$failure_tail"
            {
              echo "### Almdina ERP test failure details"
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"

      - name: Certify DCO ${{ inputs.phase_a_comparison_case == 'B_C' && 'Phase A cases B and C' || inputs.phase_a_comparison_case == 'B' && 'Phase A case B' || inputs.phase_a_comparison_only && 'Phase A comparison' || inputs.new_local_gate_only && 'NEW recovery' || inputs.new_customer_field_smoke_only && 'NEW Customer field smoke' || inputs.new_form_smoke_only && 'NEW form smoke' || inputs.new_stress_only && 'NEW stress' || 'EDIT recovery' }} in real Frappe Desk
        if: always() && !cancelled()
        env:
          DCO_DESK_FIXTURE_FILE: ${{ runner.temp }}/dco-desk-fixtures.json
          DCO_DESK_EVIDENCE_DIR: ${{ runner.temp }}/dco-desk-evidence
          DCO_DESK_NEW_FORM_SMOKE_ONLY: ${{ inputs.new_form_smoke_only && '1' || '0' }}
          DCO_DESK_NEW_CUSTOMER_FIELD_SMOKE_ONLY: ${{ inputs.new_customer_field_smoke_only && '1' || '0' }}
          DCO_DESK_PHASE_A_COMPARISON_ONLY: ${{ (inputs.phase_a_comparison_only || inputs.phase_a_comparison_case == 'B' || inputs.phase_a_comparison_case == 'B_C') && '1' || '0' }}
          DCO_DESK_PHASE_A_COMPARISON_CASE: ${{ inputs.phase_a_comparison_case || 'all' }}
          DCO_DESK_NEW_LOCAL_GATE_ONLY: ${{ inputs.new_local_gate_only && '1' || '0' }}
          DCO_DESK_NEW_STRESS_ONLY: ${{ inputs.new_stress_only && '1' || '0' }}
          DCO_DESK_NEW_STRESS_PIECE_COUNT: ${{ inputs.new_stress_piece_count || '200' }}
          FRAPPE_DESK_URL: http://test.localhost:8000
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          desk_log="$RUNNER_TEMP/dco-desk-certification.log"
          phase="app asset build"
          desk_fail() {
            status="$1"
            trap - ERR
            browser_summary="$(python3 - "$RUNNER_TEMP/dco-desk-evidence" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          try:
              diagnostics = json.loads((evidence / "browser-diagnostics.json").read_text())
          except (OSError, ValueError):
              diagnostics = {}
          try:
              trace = json.loads((evidence / "dco-desk-trace.json").read_text())
          except (OSError, ValueError):
              trace = []
          latest_form_diagnosis = next(
              (item for item in reversed(trace) if item.get("event") == "new_form_wait_diagnosis"),
              {},
          )
          latest_dom_event = next(
              (
                  item for item in reversed(trace)
                  if item.get("event") == "new_form_dom_evidence"
                  and item.get("stage") == "at_wait_failure"
              ),
              {},
          )
          try:
              latest_dom_snapshot = json.loads(latest_dom_event.get("diagnostic", ""))
          except (TypeError, ValueError):
              latest_dom_snapshot = None
          try:
              open_api_requests = json.loads(latest_form_diagnosis.get("pending_api_requests", "[]"))
          except (TypeError, ValueError):
              open_api_requests = []
          comparison_cases = []
          for case_dir in sorted(evidence.glob("case-*")):
              if not case_dir.is_dir():
                  continue
              try:
                  case_trace = json.loads((case_dir / "dco-desk-trace.json").read_text())
              except (OSError, ValueError):
                  case_trace = []
              try:
                  case_diagnostics = json.loads((case_dir / "browser-diagnostics.json").read_text())
              except (OSError, ValueError):
                  case_diagnostics = {}
              key_events = [
                  {key: str(item[key])[:220] for key in
                      ("event", "step", "status", "batches", "events", "tasks")
                      if key in item}
                  for item in case_trace if item.get("event") in {
                      "comparison_case_completed", "comparison_case_failed",
                      "comparison_form_ready", "comparison_renderer_heartbeat_failed",
                      "cdp_renderer_main_identified", "cdp_renderer_main_long_tasks",
                      "comparison_cdp_tracing_complete", "comparison_cdp_flush_timeout",
                      "page_error", "step_failed",
                  }
              ][-8:]
              pending = case_diagnostics.get("state", {}).get("pendingRequests", [])
              comparison_cases.append({
                  "case": case_dir.name.removeprefix("case-"),
                  "events": key_events,
                  "pending_methods": [
                      str(item.get("url", "")).split("/api/method/", 1)[-1]
                      for item in pending if "/api/method/" in str(item.get("url", ""))
                  ][-4:],
              })
          if comparison_cases:
              print(json.dumps({"comparison_cases": comparison_cases}, ensure_ascii=False, separators=(",", ":")))
          elif not diagnostics and not trace:
              print("browser evidence not available")
          else:
              state = diagnostics.get("state", {})
              result = {
                  "diagnostics_available": bool(diagnostics),
                  "state": {
                      "failure": state.get("failure"),
                      "url": state.get("url"),
                      "frappe": state.get("frappePresent"),
                      "boot": state.get("bootPresent"),
                      "setup_complete": state.get("setupComplete"),
                      "route": state.get("route"),
                  },
                  "last_trace_events": [
                      {key: item.get(key) for key in ("event", "step", "active_step", "status", "error") if key in item}
                      for item in trace[-16:]
                  ],
                  "last_form_wait_diagnosis": {
                      "step": latest_form_diagnosis.get("step"),
                      "failed_step": latest_form_diagnosis.get("failed_step"),
                      "failure": latest_form_diagnosis.get("failure"),
                      "snapshot_capture_failure": latest_form_diagnosis.get("dom_capture_failure"),
                  },
                  "dom_snapshot_at_wait_failure": latest_dom_snapshot,
                  "open_api_requests_at_wait_failure": open_api_requests,
                  "page_errors": [
                      {"text": str(item.get("text", ""))[:180], "stack": str(item.get("stack", ""))[:1000]}
                      for item in diagnostics.get("page_errors", [])[-3:]
                  ],
                  "console_errors": [
                      {"text": str(item.get("text", ""))[:180], "location": str(item.get("location", ""))[:180]}
                      for item in diagnostics.get("console", []) if item.get("type") == "error"
                  ][-8:],
                  "network_failures": [
                      {"url": str(item.get("url", ""))[:100], "failure": str(item.get("failure", ""))[:100]}
                      for item in diagnostics.get("request_failures", [])[-4:]
                  ],
                  "api_responses": [
                      {"url": item.get("url"), "status": item.get("status")}
                      for item in diagnostics.get("responses", [])
                      if item.get("resource_type") in {"xhr", "fetch"}
                  ][-8:],
              }
              print(json.dumps(result, ensure_ascii=False, separators=(",", ":"))[:5000])
          PY
          )"
            detail="browser_summary=$browser_summary"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            printf '::error title=Real Desk certification failed::phase=%s exit=%s detail=%s\n' "$phase" "$status" "$detail"
            {
              echo '### Real Frappe Desk certification failure'
              printf 'Failed phase: %s (exit %s)\n' "$phase" "$status"
              echo '#### Browser, final DOM, and open API diagnosis'
              echo '```json'
              echo "$browser_summary"
              echo '```'
              for log in "$desk_log" "$RUNNER_TEMP/desk-bench.log"; do
                if [[ -f "$log" ]]; then
                  echo "#### $(basename "$log")"
                  echo '```text'
                  tail -n 100 "$log"
                  echo '```'
                fi
              done
            } >> "$GITHUB_STEP_SUMMARY"
            for log in "$desk_log" "$RUNNER_TEMP/desk-bench.log"; do
              if [[ -f "$log" ]]; then tail -n 100 "$log"; fi
            done
            exit "$status"
          }
          trap 'desk_fail $?' ERR
          bench build --app almdina_erp 2>&1 | tee -a "$desk_log"
          phase="Phase A: pinned runtime, setup wizard, and site preflight"
          bench --site test.localhost execute 'frappe.get_attr("almdina_erp.tests.dco_recovery_desk_fixture.prepare_desk_test_site")()' 2>&1 | tee -a "$desk_log"
          phase="isolated ERPNext and DCO fixtures"
          bench --site test.localhost execute 'frappe.get_attr("almdina_erp.tests.dco_recovery_desk_fixture.create_desk_edit_recovery_fixtures")()' 2>&1 | tee -a "$desk_log"
          phase="Playwright install"
          ./env/bin/pip install playwright 2>&1 | tee -a "$desk_log"
          phase="Chromium install"
          ./env/bin/python -m playwright install --with-deps chromium 2>&1 | tee -a "$desk_log"
          phase="Bench start"
          bench start > "$RUNNER_TEMP/desk-bench.log" 2>&1 &
          bench_pid=$!
          trap 'kill "$bench_pid" 2>/dev/null || true' EXIT
          phase="Desk server readiness"
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$FRAPPE_DESK_URL/api/method/ping" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            desk_fail 1
          fi
          if [[ "$DCO_DESK_PHASE_A_COMPARISON_ONLY" == 1 ]]; then
            comparison_failed=0
            mkdir -p "$RUNNER_TEMP/dco-desk-evidence"
            comparison_cases=(D A B C)
            case "$DCO_DESK_PHASE_A_COMPARISON_CASE" in
              all) ;;
              B) comparison_cases=(B) ;;
              B_C) comparison_cases=(B C) ;;
              *) printf 'Unsupported Phase A comparison case\n' >&2; desk_fail 2 ;;
            esac
            for comparison_case in "${comparison_cases[@]}"; do
              phase="Phase A comparison $comparison_case"
              case_evidence="$RUNNER_TEMP/dco-desk-evidence/case-$comparison_case"
              case_log="$RUNNER_TEMP/dco-desk-evidence/case-$comparison_case.log"
              if DCO_DESK_COMPARISON_CASE="$comparison_case" DCO_DESK_EVIDENCE_DIR="$case_evidence" \
                  timeout --signal=INT --kill-after=5s 90s ./env/bin/python -u \
                    apps/almdina_erp/almdina_erp/ci/dco_frappe_desk_recovery.py > "$case_log" 2>&1; then
                case_status=0
              else
                case_status=$?
                comparison_failed=1
              fi
              printf '%s\t%s\n' "$comparison_case" "$case_status" \
                >> "$RUNNER_TEMP/dco-desk-evidence/comparison-results.tsv"
              python3 - "$comparison_case" "$case_status" "$case_evidence" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          import time
          from pathlib import Path

          case, status, evidence_dir = sys.argv[1], int(sys.argv[2]), Path(sys.argv[3])
          try:
              trace = json.loads((evidence_dir / "dco-desk-trace.json").read_text())
          except (OSError, ValueError):
              trace = []
          try:
              diagnostics = json.loads((evidence_dir / "browser-diagnostics.json").read_text())
          except (OSError, ValueError):
              diagnostics = {}
          selected_events = {
              "comparison_service_completed", "comparison_service_failed",
              "comparison_list_new_action_wait_started", "comparison_list_new_action_ready",
              "comparison_list_new_action_click_started", "comparison_list_new_action_clicked",
              "comparison_form_ready", "comparison_navigation_started",
              "comparison_navigation_response", "comparison_cdp_unavailable",
              "comparison_cdp_stop_failed", "comparison_cdp_flush_timeout",
              "comparison_renderer_heartbeat_completed", "comparison_renderer_heartbeat_failed",
              "comparison_cdp_started", "comparison_cdp_stopped",
              "comparison_cdp_tracing_complete",
              "cdp_renderer_main_identified", "cdp_renderer_main_long_tasks",
              "phase_135_new_customer_field_smoke_completed",
              "cdp_performance_metrics", "new_form_dom_evidence",
              "new_form_dom_capture_failed", "new_form_wait_diagnosis",
              "comparison_case_completed", "comparison_case_failed",
              "step_failed", "wait_failed", "certification_failed",
          }
          events = [
              {key: item[key] for key in ("event", "stage", "step", "status", "method",
                  "result_class", "elapsed_seconds", "route", "doctype", "metrics", "tasks",
                  "thread_count", "batches", "events")
                  if key in item}
              for item in trace if item.get("event") in selected_events
          ]
          latest_dom_event = next(
              (item for item in reversed(trace) if item.get("event") == "new_form_dom_evidence"),
              {},
          )
          try:
              latest_dom = json.loads(latest_dom_event.get("diagnostic", ""))
          except (TypeError, ValueError):
              latest_dom = None
          pending = diagnostics.get("state", {}).get("pendingRequests", [])
          first_failure = next(
              (item for item in trace if item.get("event") in
                  {"step_failed", "wait_failed", "comparison_service_failed", "comparison_case_failed"}),
              {},
          )
          last_active = next(
              (item for item in reversed(trace) if item.get("event") in {
                  "step_started", "wait_started", "comparison_service_started",
                  "comparison_navigation_started", "comparison_list_new_action_wait_started",
                  "comparison_list_new_action_click_started",
              }),
              {},
          )
          result = {
              "case": case, "exit": status, "trace_available": bool(trace),
              "events": events[-18:],
              "first_failure": {
                  key: str(first_failure[key])[:300]
                  for key in ("event", "step", "method", "error") if key in first_failure
              },
              "last_started_step": {
                  key: str(last_active[key])[:180]
                  for key in ("event", "step", "method", "route") if key in last_active
              },
              "latest_dom_snapshot": latest_dom,
              "pending_api_requests": [
                  {"url": item.get("url"), "age_seconds": round(max(0, time.time() - item.get("started", 0)), 1)}
                  for item in pending if "/api/method/" in str(item.get("url", ""))
              ][-8:],
              "page_errors": len(diagnostics.get("page_errors", [])),
              "request_failures": len(diagnostics.get("request_failures", [])),
          }
          print(f"#### Phase A comparison {case}")
          print("```json")
          print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))
          print("```")
          PY
              printf 'Phase A case %s exited %s\n' "$comparison_case" "$case_status" >> "$desk_log"
            done
            phase="Phase A comparative results"
            if [[ "$comparison_failed" != 0 ]]; then desk_fail 1; fi
          else
            phase="Desk browser certification"
            timeout --signal=INT --kill-after=45s 480s ./env/bin/python -u \
              apps/almdina_erp/almdina_erp/ci/dco_frappe_desk_recovery.py 2>&1 | tee -a "$desk_log"
          fi

      - name: Collect integration diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/integration-diagnostics"
          for log in \
            new-site.log \
            install-erpnext.log \
            install-almdina.log \
            migrate-first.log \
            migrate-second.log \
            tests.log \
            dco-desk-certification.log \
            desk-bench.log; do
            cp "$RUNNER_TEMP/$log" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          done
          cp -R "$RUNNER_TEMP/dco-desk-evidence" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          find "$RUNNER_TEMP/frappe-bench/sites" -maxdepth 2 -type f -print > "$RUNNER_TEMP/integration-diagnostics/site-files.txt" 2>&1
          cd "$RUNNER_TEMP/frappe-bench" && bench version > "$RUNNER_TEMP/integration-diagnostics/bench-version.txt" 2>&1
          mariadb -h 127.0.0.1 -uroot -proot -e 'SELECT VERSION(); SHOW VARIABLES LIKE "character_set_server"; SHOW VARIABLES LIKE "collation_server"; SELECT User, Host FROM mysql.user;' > "$RUNNER_TEMP/integration-diagnostics/mariadb.txt" 2>&1

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-v16-integration-diagnostics
          path: ${{ runner.temp }}/integration-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Disable tests
        if: always()
        run: |
          cd "$RUNNER_TEMP/frappe-bench" || exit 0
          bench --site test.localhost set-config allow_tests false || true

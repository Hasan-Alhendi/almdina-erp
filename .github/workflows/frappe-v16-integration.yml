name: Frappe v16 Integration

on:
  workflow_dispatch:
    inputs:
      frappe_ref:
        description: Frappe tag or branch to certify
        required: true
        default: version-16
        type: string
      erpnext_ref:
        description: ERPNext tag or branch to certify
        required: true
        default: version-16
        type: string
      desk_only:
        description: Skip the full Python suite and run only real Desk certification
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "almdina_erp/**"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - ".github/workflows/frappe-v16-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout Almdina ERP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mariadb-client \
            libmariadb-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            wkhtmltopdf \
            xvfb \
            redis-tools
          sudo npm install -g yarn

      - name: Install Bench CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade frappe-bench

      - name: Verify Frappe v16 toolchain
        run: |
          set -euo pipefail
          python --version
          node --version
          yarn --version
          mariadb --version
          bench --version
          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"Expected Python 3.14, got {sys.version}")
          PY
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 24) { throw new Error(`Expected Node 24+, got ${process.version}`); }'
          mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent
          redis-cli -h 127.0.0.1 -p 13000 ping | grep -qx PONG
          redis-cli -h 127.0.0.1 -p 11000 ping | grep -qx PONG

      - name: Initialize Frappe v16 bench
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || 'version-16' }}
        run: |
          bench init "$RUNNER_TEMP/frappe-bench" \
            --frappe-branch "$FRAPPE_REF" \
            --python python3.14 \
            --skip-redis-config-generation

      - name: Install ERPNext v16 and local app source
        env:
          APP_SOURCE: ${{ github.workspace }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'version-16' }}
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench get-app erpnext --branch "$ERPNEXT_REF"
          git clone "$APP_SOURCE" apps/almdina_erp
          ./env/bin/pip install -e 'apps/almdina_erp[test]'
          python - <<'PY'
          from pathlib import Path

          apps_path = Path("sites/apps.txt")
          apps = [
              line.strip()
              for line in apps_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if "almdina_erp" not in apps:
              apps.append("almdina_erp")
          apps_path.write_text("\n".join(apps) + "\n", encoding="utf-8")
          PY

      - name: Record and verify application source refs
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || 'version-16' }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'version-16' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          FRAPPE_SHA="$(git -C apps/frappe rev-parse HEAD)"
          ERPNEXT_SHA="$(git -C apps/erpnext rev-parse HEAD)"
          printf 'Frappe ref=%s sha=%s\nERPNext ref=%s sha=%s\n' \
            "$FRAPPE_REF" "$FRAPPE_SHA" "$ERPNEXT_REF" "$ERPNEXT_SHA"
          if [[ "$FRAPPE_REF" == "v16.17.5" ]]; then
            test "$FRAPPE_SHA" = "75baafaa0bde07a86bf28764383b93b5df97bc7e"
          fi
          if [[ "$ERPNEXT_REF" == "v16.17.0" ]]; then
            test "$ERPNEXT_SHA" = "7b494dc9e8e47d288de5427bae25ce8a52c37d96"
          fi

      - name: Configure Redis URLs
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Create integration site
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench new-site test.localhost \
            --db-host 127.0.0.1 \
            --db-root-username root \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket \
            --verbose 2>&1 | tee "$RUNNER_TEMP/new-site.log"

      - name: Install ERPNext and Almdina ERP
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost install-app erpnext 2>&1 | tee "$RUNNER_TEMP/install-erpnext.log"
          bench --site test.localhost install-app almdina_erp 2>&1 | tee "$RUNNER_TEMP/install-almdina.log"

      - name: Run migrate twice for idempotency
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.seed_retired_standard_pages
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.seed_retired_standard_reports
          bench --site test.localhost migrate 2>&1 | tee "$RUNNER_TEMP/migrate-first.log"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent
          bench --site test.localhost migrate 2>&1 | tee "$RUNNER_TEMP/migrate-second.log"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent

      - name: Verify installed apps and schema
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost list-apps
          bench --site test.localhost execute frappe.get_all --kwargs '{"doctype":"DocType","filters":{"module":"Almdina ERP"},"pluck":"name"}'

      - name: Run Almdina ERP tests
        if: github.event_name != 'workflow_dispatch' || inputs.desk_only != true
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost set-config allow_tests true
          set +e
          bench --site test.localhost run-tests --app almdina_erp 2>&1 | tee "$RUNNER_TEMP/tests.log"
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            failure_tail="$(python - "$RUNNER_TEMP/tests.log" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          lines = text.splitlines()
          pattern = re.compile(r"(?i)(?:\bFAILED\b|\bFAIL\b|\bERROR\b|Traceback|AssertionError|Exception|Ran \d+ tests)")
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 1), min(len(lines), index + 2)))
          print("\n".join(lines[index] for index in sorted(selected)[-120:]))
          PY
          )"
            if [[ -z "$failure_tail" ]]; then
              failure_tail="$(tail -n 100 "$RUNNER_TEMP/tests.log")"
            fi
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            printf '::error title=Frappe test output::%s\n' "$failure_tail"
            {
              echo "### Almdina ERP test failure details"
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"

      - name: Certify DCO EDIT recovery in real Frappe Desk
        if: always() && !cancelled()
        env:
          DCO_DESK_FIXTURE_FILE: ${{ runner.temp }}/dco-desk-fixtures.json
          DCO_DESK_EVIDENCE_DIR: ${{ runner.temp }}/dco-desk-evidence
          FRAPPE_DESK_URL: http://test.localhost:8000
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          desk_log="$RUNNER_TEMP/dco-desk-certification.log"
          phase="app asset build"
          desk_fail() {
            status="$1"
            trap - ERR
            detail="$(tail -n 16 "$desk_log" 2>/dev/null | tr '\n' ' ')"
            browser_summary="$(python3 - "$RUNNER_TEMP/dco-desk-evidence" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          try:
              diagnostics = json.loads((evidence / "browser-diagnostics.json").read_text())
              trace = json.loads((evidence / "dco-desk-trace.json").read_text())
          except (OSError, ValueError):
              print("browser evidence not available")
          else:
              state = diagnostics.get("state", {})
              recent_events = []
              for item in trace:
                  if item.get("event") not in {
                      "navigation", "request_failed", "response", "step_started", "step_completed",
                      "step_failed", "wait_started", "wait_failed",
                  }:
                      continue
                  event = {key: item.get(key) for key in ("event", "step", "active_step", "url", "status", "error") if key in item}
                  if "url" in event:
                      event["url"] = str(event["url"])[:100]
                  if "step" in event:
                      event["step"] = str(event["step"])[:50]
                  if "error" in event:
                      event["error"] = str(event["error"])[:100]
                  recent_events.append(event)
              pending = [
                  {"url": str(item.get("url", ""))[:100], "resource_type": item.get("resource_type")}
                  for item in state.get("pendingRequests", [])
                  if item.get("resource_type") in {"xhr", "fetch"}
              ][-2:]
              save_probe = state.get("saveProbe") or {}
              result = {
                  "failure": state.get("failure"),
                  "url": state.get("url"),
                  "desk_boot": {
                      "setup_complete": state.get("setupComplete"),
                      "ajax_count": state.get("ajaxCount"),
                      "route": state.get("route"),
                  },
                  "save_probe": {
                      key: save_probe.get(key)
                      for key in (
                          "dirtyBeforeSave", "ajaxCountAtSave", "costUxPresent", "pendingPriceEdits",
                          "saveStarted", "saveSettled", "scriptEvents", "runSeriallyCalls", "runSeriallySettled",
                          "beforeSaveHandlers", "beforeSaveTriggerStarted", "beforeSaveTriggerSettled",
                          "activeBeforeSaveHandler", "handlerCalls", "afterServerCalls",
                      )
                      if key in save_probe
                  },
                  "commit_network_events": [
                      event for event in recent_events
                      if event.get("active_step") == "commit recovered EDIT session"
                  ][-8:],
                  "last_events": recent_events[-4:],
                  "pending_api": pending,
                  "api_responses": state.get("apiResponses", [])[-2:],
                  "browser_errors": [
                      str(item.get("text", ""))[:120]
                      for item in diagnostics.get("page_errors", [])[-1:]
                  ],
                  "network_failures": [
                      {"url": str(item.get("url", ""))[:100], "failure": str(item.get("failure", ""))[:100]}
                      for item in diagnostics.get("request_failures", [])[-2:]
                  ],
              }
              print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))
          PY
          )"
            browser_summary="${browser_summary:0:1500}"
            detail="$detail browser_summary=$browser_summary"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            printf '::error title=Real Desk certification failed::phase=%s exit=%s detail=%s\n' "$phase" "$status" "$detail"
            {
              echo '### Real Frappe Desk certification failure'
              echo "Failed phase: `$phase` (exit $status)"
              for log in "$desk_log" "$RUNNER_TEMP/desk-bench.log"; do
                if [[ -f "$log" ]]; then
                  echo "#### $(basename "$log")"
                  echo '```text'
                  tail -n 100 "$log"
                  echo '```'
                fi
              done
            } >> "$GITHUB_STEP_SUMMARY"
            for log in "$desk_log" "$RUNNER_TEMP/desk-bench.log"; do
              if [[ -f "$log" ]]; then tail -n 100 "$log"; fi
            done
            exit "$status"
          }
          trap 'desk_fail $?' ERR
          bench build --app almdina_erp 2>&1 | tee -a "$desk_log"
          phase="isolated ERPNext and DCO fixtures"
          bench --site test.localhost execute 'frappe.get_attr("almdina_erp.tests.dco_recovery_desk_fixture.create_desk_edit_recovery_fixtures")()' 2>&1 | tee -a "$desk_log"
          phase="Playwright install"
          ./env/bin/pip install playwright 2>&1 | tee -a "$desk_log"
          phase="Chromium install"
          ./env/bin/python -m playwright install --with-deps chromium 2>&1 | tee -a "$desk_log"
          phase="Bench start"
          bench start > "$RUNNER_TEMP/desk-bench.log" 2>&1 &
          bench_pid=$!
          trap 'kill "$bench_pid" 2>/dev/null || true' EXIT
          phase="Desk server readiness"
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$FRAPPE_DESK_URL/api/method/ping" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            desk_fail 1
          fi
          phase="Desk EDIT recovery browser certification"
          timeout --signal=INT --kill-after=45s 480s ./env/bin/python -u apps/almdina_erp/almdina_erp/ci/dco_frappe_desk_recovery.py 2>&1 | tee -a "$desk_log"

      - name: Collect integration diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/integration-diagnostics"
          for log in \
            new-site.log \
            install-erpnext.log \
            install-almdina.log \
            migrate-first.log \
            migrate-second.log \
            tests.log \
            dco-desk-certification.log \
            desk-bench.log; do
            cp "$RUNNER_TEMP/$log" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          done
          cp -R "$RUNNER_TEMP/dco-desk-evidence" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          find "$RUNNER_TEMP/frappe-bench/sites" -maxdepth 2 -type f -print > "$RUNNER_TEMP/integration-diagnostics/site-files.txt" 2>&1
          cd "$RUNNER_TEMP/frappe-bench" && bench version > "$RUNNER_TEMP/integration-diagnostics/bench-version.txt" 2>&1
          mariadb -h 127.0.0.1 -uroot -proot -e 'SELECT VERSION(); SHOW VARIABLES LIKE "character_set_server"; SHOW VARIABLES LIKE "collation_server"; SELECT User, Host FROM mysql.user;' > "$RUNNER_TEMP/integration-diagnostics/mariadb.txt" 2>&1

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-v16-integration-diagnostics
          path: ${{ runner.temp }}/integration-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Disable tests
        if: always()
        run: |
          cd "$RUNNER_TEMP/frappe-bench" || exit 0
          bench --site test.localhost set-config allow_tests false || true

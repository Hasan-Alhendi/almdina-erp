name: Frappe v16 Integration

on:
  workflow_dispatch:
    inputs:
      frappe_ref:
        description: Frappe tag or branch to certify
        required: true
        default: version-16
        type: string
      erpnext_ref:
        description: ERPNext tag or branch to certify
        required: true
        default: version-16
        type: string
      suite:
        description: Select the integration suite for the isolated Frappe site
        required: true
        default: full
        type: choice
        options:
          - full
          - al128_desk
          - al128_desk_edit
          - al128_performance
          - al129_new_desk
      comparison_base:
        description: PR base branch used for AL128 before/after measurements
        required: true
        default: Recovery-test
        type: string
  pull_request:
    paths:
      - "almdina_erp/**"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - ".github/workflows/frappe-v16-integration.yml"
      - "almdina_erp/tests/al128_desk_fixture.py"
      - "tests/browser/test_dco_al128_frappe_desk.py"
      - "almdina_erp/tests/al129_desk_fixture.py"
      - "tests/browser/test_dco_al129_frappe_desk.py"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout Almdina ERP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mariadb-client \
            libmariadb-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            wkhtmltopdf \
            xvfb \
            redis-tools
          sudo npm install -g yarn

      - name: Install Bench CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade frappe-bench

      - name: Verify Frappe v16 toolchain
        run: |
          set -euo pipefail
          python --version
          node --version
          yarn --version
          mariadb --version
          bench --version
          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"Expected Python 3.14, got {sys.version}")
          PY
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 24) { throw new Error(`Expected Node 24+, got ${process.version}`); }'
          mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent
          redis-cli -h 127.0.0.1 -p 13000 ping | grep -qx PONG
          redis-cli -h 127.0.0.1 -p 11000 ping | grep -qx PONG

      - name: Require pinned Desk acceptance runtime refs
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref }}
        run: |
          set -euo pipefail
          test "$FRAPPE_REF" = "v16.17.5" || {
            echo "Pinned Desk acceptance requires Frappe v16.17.5; received '$FRAPPE_REF'." >&2
            exit 1
          }
          test "$ERPNEXT_REF" = "v16.17.0" || {
            echo "Pinned Desk acceptance requires ERPNext v16.17.0; received '$ERPNEXT_REF'." >&2
            exit 1
          }

      - name: Initialize Frappe v16 bench
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || 'version-16' }}
        run: |
          bench init "$RUNNER_TEMP/frappe-bench" \
            --frappe-branch "$FRAPPE_REF" \
            --python python3.14 \
            --skip-redis-config-generation

      - name: Install ERPNext v16 and local app source
        env:
          APP_SOURCE: ${{ github.workspace }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'version-16' }}
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench get-app erpnext --branch "$ERPNEXT_REF"
          git clone "$APP_SOURCE" apps/almdina_erp
          ./env/bin/pip install -e 'apps/almdina_erp[test]'
          python - <<'PY'
          from pathlib import Path

          apps_path = Path("sites/apps.txt")
          apps = [
              line.strip()
              for line in apps_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if "almdina_erp" not in apps:
              apps.append("almdina_erp")
          apps_path.write_text("\n".join(apps) + "\n", encoding="utf-8")
          PY

      - name: Record and verify application source refs
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || 'version-16' }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'version-16' }}
          TARGET_SUITE: ${{ inputs.suite || 'full' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          FRAPPE_SHA="$(git -C apps/frappe rev-parse HEAD)"
          ERPNEXT_SHA="$(git -C apps/erpnext rev-parse HEAD)"
          printf 'Frappe ref=%s sha=%s\nERPNext ref=%s sha=%s\n' \
            "$FRAPPE_REF" "$FRAPPE_SHA" "$ERPNEXT_REF" "$ERPNEXT_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ("$TARGET_SUITE" == "al128_desk" || "$TARGET_SUITE" == "al128_desk_edit" || "$TARGET_SUITE" == "al128_performance" || "$TARGET_SUITE" == "al129_new_desk") ]]; then
            test "$FRAPPE_SHA" = "75baafaa0bde07a86bf28764383b93b5df97bc7e"
            test "$ERPNEXT_SHA" = "7b494dc9e8e47d288de5427bae25ce8a52c37d96"
          else
            if [[ "$FRAPPE_REF" == "v16.17.5" ]]; then
              test "$FRAPPE_SHA" = "75baafaa0bde07a86bf28764383b93b5df97bc7e"
            fi
            if [[ "$ERPNEXT_REF" == "v16.17.0" ]]; then
              test "$ERPNEXT_SHA" = "7b494dc9e8e47d288de5427bae25ce8a52c37d96"
            fi
          fi

      - name: Configure Redis URLs
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Create integration site
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench new-site test.localhost \
            --db-host 127.0.0.1 \
            --db-root-username root \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket \
            --verbose 2>&1 | tee "$RUNNER_TEMP/new-site.log"

      - name: Install ERPNext and Almdina ERP
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost install-app erpnext 2>&1 | tee "$RUNNER_TEMP/install-erpnext.log"
          bench --site test.localhost install-app almdina_erp 2>&1 | tee "$RUNNER_TEMP/install-almdina.log"

      - name: Run migrate twice for idempotency
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.seed_retired_standard_pages
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.seed_retired_standard_reports
          bench --site test.localhost migrate 2>&1 | tee "$RUNNER_TEMP/migrate-first.log"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent
          bench --site test.localhost migrate 2>&1 | tee "$RUNNER_TEMP/migrate-second.log"
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_pages_absent
          bench --site test.localhost execute almdina_erp.tests.test_schema_install.assert_retired_standard_reports_absent

      - name: Verify installed apps and schema
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost list-apps
          bench --site test.localhost execute frappe.get_all --kwargs '{"doctype":"DocType","filters":{"module":"Almdina ERP"},"pluck":"name"}'

      - name: Prepare isolated ALMADINA-128 Desk fixtures
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance')
        env:
          DCO_AL128_FIXTURE_FILE: ${{ runner.temp }}/al128-desk-fixtures.json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          run_fixture_step() {
            local method="$1"
            local log_file="$2"
            set +e
            bench --site test.localhost execute "$method" 2>&1 | tee "$RUNNER_TEMP/$log_file"
            local command_status=${PIPESTATUS[0]}
            set -e
            if (( command_status != 0 )); then
              local failure_tail
              failure_tail="$(tail -n 60 "$RUNNER_TEMP/$log_file")"
              failure_tail="${failure_tail//'%'/'%25'}"
              failure_tail="${failure_tail//$'\r'/'%0D'}"
              failure_tail="${failure_tail//$'\n'/'%0A'}"
              printf '::error title=AL128 fixture preparation failure::%s\n' "$failure_tail"
              {
                echo "### ALMADINA-128 fixture preparation failed: $method"
                echo '```text'
                tail -n 60 "$RUNNER_TEMP/$log_file"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              return "$command_status"
            fi
          }
          run_fixture_step almdina_erp.tests.al128_desk_fixture.prepare_al128_desk_site al128-fixture-prepare.log
          run_fixture_step almdina_erp.tests.al128_desk_fixture.create_al128_desk_fixtures al128-fixture-create.log
          test -s "$DCO_AL128_FIXTURE_FILE"
          echo "DCO_AL128_FIXTURE_FILE=$DCO_AL128_FIXTURE_FILE" >> "$GITHUB_ENV"

      - name: Prepare isolated ALMADINA-129 Desk fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'al129_new_desk'
        env:
          DCO_AL129_FIXTURE_FILE: ${{ runner.temp }}/al129-desk-fixtures.json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          run_fixture_step() {
            local method="$1"
            local log_file="$2"
            set +e
            bench --site test.localhost execute "$method" 2>&1 | tee "$RUNNER_TEMP/$log_file"
            local status=${PIPESTATUS[0]}
            set -e
            if (( status != 0 )); then
              {
                echo "### ALMADINA-129 fixture preparation failed: $method"
                echo '```text'
                tail -n 70 "$RUNNER_TEMP/$log_file"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              return "$status"
            fi
          }
          run_fixture_step almdina_erp.tests.al129_desk_fixture.prepare_al129_desk_site al129-fixture-setup.log
          run_fixture_step almdina_erp.tests.al129_desk_fixture.create_al129_desk_fixtures al129-fixture-create.log
          test -s "$DCO_AL129_FIXTURE_FILE"
          echo "DCO_AL129_FIXTURE_FILE=$DCO_AL129_FIXTURE_FILE" >> "$GITHUB_ENV"

      - name: Run the ALMADINA-129 concurrent token database race test
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'al129_new_desk'
        env:
          AL129_DB_ROOT_HOST: 127.0.0.1
          AL129_DB_ROOT_USER: root
          AL129_DB_ROOT_PASSWORD: root
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost set-config allow_tests true
          export AL129_CONCURRENCY_EVIDENCE_FILE="$RUNNER_TEMP/al129-concurrency-evidence.json"
          rm -f "$AL129_CONCURRENCY_EVIDENCE_FILE"
          set +e
          bench --site test.localhost run-tests --module almdina_erp.tests.test_new_order_recovery_integration \
            --test test_concurrent_database_inserts_reject_duplicate_creation_token \
            2>&1 | tee "$RUNNER_TEMP/al129-integration-tests.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            {
              echo '### ALMADINA-129 concurrent token race: FAIL'
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/al129-integration-tests.log"
              echo '```'
              if [[ -s "$AL129_CONCURRENCY_EVIDENCE_FILE" ]]; then
                echo 'Database race evidence:'
                echo '```json'
                cat "$AL129_CONCURRENCY_EVIDENCE_FILE"
                echo '```'
              else
                echo 'The concurrency test did not produce its evidence file.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ -s "$AL129_CONCURRENCY_EVIDENCE_FILE" ]]; then
              cat "$AL129_CONCURRENCY_EVIDENCE_FILE"
            fi
            exit "$test_status"
          fi
          if ! grep -Eq 'Ran 1 tests? in ' "$RUNNER_TEMP/al129-integration-tests.log"; then
            {
              echo '### ALMADINA-129 concurrent token race: FAIL'
              echo 'The requested single test was not proven to run exactly once.'
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/al129-integration-tests.log"
              echo '```'
              if [[ -s "$AL129_CONCURRENCY_EVIDENCE_FILE" ]]; then
                echo '```json'
                cat "$AL129_CONCURRENCY_EVIDENCE_FILE"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if grep -Fq 'INCONCLUSIVE concurrent insert outcome' "$RUNNER_TEMP/al129-integration-tests.log" \
            || grep -Eq 'OK \(skipped=[1-9][0-9]*' "$RUNNER_TEMP/al129-integration-tests.log"; then
            {
              echo '### ALMADINA-129 concurrent token race: INCONCLUSIVE'
              echo 'The test was skipped; the concurrency gate remains blocked.'
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/al129-integration-tests.log"
              echo '```'
              if [[ -s "$AL129_CONCURRENCY_EVIDENCE_FILE" ]]; then
                echo '```json'
                cat "$AL129_CONCURRENCY_EVIDENCE_FILE"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ -s "$AL129_CONCURRENCY_EVIDENCE_FILE" ]]; then
              cat "$AL129_CONCURRENCY_EVIDENCE_FILE"
            fi
            exit 1
          fi
          if [[ ! -s "$AL129_CONCURRENCY_EVIDENCE_FILE" ]]; then
            {
              echo '### ALMADINA-129 concurrent token race: FAIL'
              echo 'The targeted test passed without writing its database race evidence.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo '### ALMADINA-129 concurrent token race: PASS'
            echo '```json'
            cat "$AL129_CONCURRENCY_EVIDENCE_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$AL129_CONCURRENCY_EVIDENCE_FILE"

      - name: Install Chromium for targeted Desk certification
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium for targeted Desk certification
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        run: |
          python -m pip install 'pytest>=9,<10' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Build Almdina ERP Desk assets
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench build --app almdina_erp

      - name: Start isolated Frappe Desk server
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        run: |
          set -euo pipefail
          echo '127.0.0.1 test.localhost' | sudo tee -a /etc/hosts >/dev/null
          cd "$RUNNER_TEMP/frappe-bench"
          nohup bench serve --port 8000 > "$RUNNER_TEMP/al128-desk-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/al128-desk-server.pid"
          ready=0
          for attempt in $(seq 1 60); do
          if curl --fail --silent --show-error http://test.localhost:8000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if (( ready != 1 )); then
            tail -n 120 "$RUNNER_TEMP/al128-desk-server.log"
            exit 1
          fi

      - name: Run targeted pinned Desk acceptance case
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        env:
          FRAPPE_DESK_URL: http://test.localhost:8000
          DCO_AL128_FIXTURE_FILE: ${{ runner.temp }}/al128-desk-fixtures.json
          DCO_AL129_FIXTURE_FILE: ${{ runner.temp }}/al129-desk-fixtures.json
          AL128_COMPARISON_BASE: ${{ inputs.comparison_base }}
          TARGET_CASE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ "$TARGET_CASE" == "al129_new_desk" ]]; then
            test -s "$DCO_AL129_FIXTURE_FILE"
            python -m pytest --collect-only -q tests/browser/test_dco_al129_frappe_desk.py \
              | tee "$RUNNER_TEMP/al129-pytest-collect.log"
            test_target="tests/browser/test_dco_al129_frappe_desk.py"
          else
            test -s "$DCO_AL128_FIXTURE_FILE"
          fi
          if [[ "$TARGET_CASE" != "al129_new_desk" ]]; then
            git check-ref-format --branch "$AL128_COMPARISON_BASE"
            git fetch origin "$AL128_COMPARISON_BASE:refs/remotes/origin/$AL128_COMPARISON_BASE"
            AL128_BASE_SHA="$(git merge-base HEAD "refs/remotes/origin/$AL128_COMPARISON_BASE")"
            export AL128_BASE_SHA
            git cat-file -e "$AL128_BASE_SHA^{commit}"
            printf 'ALMADINA-128 comparison base=%s merge-base=%s\n' \
              "$AL128_COMPARISON_BASE" "$AL128_BASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$TARGET_CASE" == "al129_new_desk" ]]; then
            test_target="tests/browser/test_dco_al129_frappe_desk.py"
            export DCO_AL129_FIXTURE_FILE
          elif [[ "$TARGET_CASE" == "al128_performance" ]]; then
            test_target="tests/browser/test_dco_al128_frappe_desk.py::test_actual_measurement_entry_performance_200_and_500_before_after"
          else
            test_target="tests/browser/test_dco_al128_frappe_desk.py::test_real_desk_edits_checkpoint_and_permission_isolation"
          fi
          set +e
          python -m pytest -q -s "$test_target" 2>&1 \
            | tee "$RUNNER_TEMP/desk-pytest.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            failure_tail="$(python - "$RUNNER_TEMP/desk-pytest.log" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          text = text.replace("al128-isolated-ci-password", "[redacted test credential]")
          lines = text.splitlines()
          selected = [
              line[:900]
              for line in lines
              if line.startswith("E ")
              or line.startswith("FAILED ")
              or line.startswith("ERROR ")
              or "FAILURES" in line
              or re.match(r"^_{3,} test_", line)
          ]
          print("\n".join(selected[-24:])[-3400:])
          PY
            )"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            printf '::error title=Real Desk test failure::%s\n' "$failure_tail"
            {
              echo "### $TARGET_CASE real Desk test failure details"
              echo '```text'
              python - "$RUNNER_TEMP/desk-pytest.log" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = text.replace("al128-isolated-ci-password", "[redacted test credential]")
          print("\n".join(text.splitlines()[-180:]))
          PY
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TARGET_CASE" == "al129_new_desk" && -s "$RUNNER_TEMP/al129-new-desk-evidence.json" ]]; then
              {
                echo '### ALMADINA-129 evidence completed before failure'
                echo '```json'
                cat "$RUNNER_TEMP/al129-new-desk-evidence.json"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "### $TARGET_CASE real Desk acceptance: PASS"
              echo 'Runtime: Frappe v16.17.5 / ERPNext v16.17.0'
              echo 'Browser: isolated Chromium; see uploaded Desk evidence for per-scenario results.'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TARGET_CASE" == "al129_new_desk" ]]; then
              python - "$RUNNER_TEMP/al129-new-desk-evidence.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print("```json")
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          print("```")
          PY
            fi
          fi
          exit "$test_status"
        timeout-minutes: 20

      - name: Upload Desk acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.suite == 'al128_desk' || inputs.suite == 'al128_desk_edit' || inputs.suite == 'al128_performance' || inputs.suite == 'al129_new_desk')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-real-desk-evidence
          path: |
            ${{ runner.temp }}/al128-desk-evidence.json
            ${{ runner.temp }}/al128-desk-trace.json
            ${{ runner.temp }}/al128-desk-failure.png
            ${{ runner.temp }}/al128-desk-server.log
            ${{ runner.temp }}/al129-new-desk-evidence.json
            ${{ runner.temp }}/al129-new-desk-trace.json
            ${{ runner.temp }}/al129-desk-failure.png
            ${{ runner.temp }}/al129-fixture-setup.log
            ${{ runner.temp }}/al129-integration-tests.log
            ${{ runner.temp }}/al129-concurrency-evidence.json
            ${{ runner.temp }}/al129-pytest-collect.log
            ${{ runner.temp }}/desk-pytest.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run Almdina ERP tests
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'al128_desk' && inputs.suite != 'al128_desk_edit' && inputs.suite != 'al128_performance' && inputs.suite != 'al129_new_desk')
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site test.localhost set-config allow_tests true
          set +e
          bench --site test.localhost run-tests --app almdina_erp 2>&1 | tee "$RUNNER_TEMP/tests.log"
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            failure_tail="$(python - "$RUNNER_TEMP/tests.log" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", text)
          lines = text.splitlines()
          pattern = re.compile(r"(?i)(?:\bFAILED\b|\bFAIL\b|\bERROR\b|Traceback|AssertionError|Exception|Ran \d+ tests)")
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 1), min(len(lines), index + 2)))
          print("\n".join(lines[index] for index in sorted(selected)[-120:]))
          PY
          )"
            if [[ -z "$failure_tail" ]]; then
              failure_tail="$(tail -n 100 "$RUNNER_TEMP/tests.log")"
            fi
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            printf '::error title=Frappe test output::%s\n' "$failure_tail"
            {
              echo "### Almdina ERP test failure details"
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"

      - name: Collect integration diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/integration-diagnostics"
          for log in \
            new-site.log \
            install-erpnext.log \
            install-almdina.log \
            migrate-first.log \
            migrate-second.log \
            al128-fixture-prepare.log \
            al128-fixture-create.log \
            al128-desk-pytest.log \
            al129-fixture-setup.log \
            al129-fixture-create.log \
            al129-integration-tests.log \
            al129-pytest-collect.log \
            desk-pytest.log \
            tests.log; do
            cp "$RUNNER_TEMP/$log" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          done
          cp "$RUNNER_TEMP/frappe-bench/sites/common_site_config.json" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/frappe-bench/sites/test.localhost/site_config.json" "$RUNNER_TEMP/integration-diagnostics/" 2>/dev/null || true
          find "$RUNNER_TEMP/frappe-bench/sites" -maxdepth 2 -type f -print > "$RUNNER_TEMP/integration-diagnostics/site-files.txt" 2>&1
          cd "$RUNNER_TEMP/frappe-bench" && bench version > "$RUNNER_TEMP/integration-diagnostics/bench-version.txt" 2>&1
          mariadb -h 127.0.0.1 -uroot -proot -e 'SELECT VERSION(); SHOW VARIABLES LIKE "character_set_server"; SHOW VARIABLES LIKE "collation_server"; SELECT User, Host FROM mysql.user;' > "$RUNNER_TEMP/integration-diagnostics/mariadb.txt" 2>&1

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-v16-integration-diagnostics
          path: ${{ runner.temp }}/integration-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Disable tests
        if: always()
        run: |
          cd "$RUNNER_TEMP/frappe-bench" || exit 0
          bench --site test.localhost set-config allow_tests false || true

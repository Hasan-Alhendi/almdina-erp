name: Cross-order P0 regression gates

on:
  pull_request:
    branches: [Develop, agent/dco-cross-order-p0-final-semantic-candidate]
    paths:
      - 'almdina_erp/tests/js/cross_order_p0_baseline.test.js'
      - 'almdina_erp/tests/js/cross_order_phase2b_native_input.test.js'
      - 'almdina_erp/tests/js/cutting_plan_print_transitions.test.js'
      - 'almdina_erp/tests/browser/test_cross_order_p0_runtime.py'
      - 'almdina_erp/tests/cross_order_p0_runtime_fixture.py'
      - 'almdina_erp/public/js/door_cutting_order/**'
      - '.github/workflows/cross-order-p0-baseline.yml'
  workflow_dispatch:

jobs:
  identity-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase 2A ownership and compatibility regressions
        run: |
          node almdina_erp/tests/js/cross_order_phase2a_ownership.test.js
          node almdina_erp/tests/js/cross_order_final_async_isolation.test.js
          node almdina_erp/tests/js/dco_workspace_lifecycle.test.js
          node almdina_erp/tests/js/cost_edit_session_lifecycle.test.js
          node almdina_erp/tests/js/plan_preview_state_ownership.test.js
          node almdina_erp/tests/js/corner_edge_tab_navigation.test.js
          node almdina_erp/tests/js/special_price_workspace_refresh.test.js
      - name: Run original Phase 1 regressions (15 expected GREEN)
        run: node almdina_erp/tests/js/cross_order_p0_baseline.test.js
      - name: Run Phase 2B native input and print geometry regressions
        run: |
          node almdina_erp/tests/js/cross_order_phase2b_native_input.test.js
          node almdina_erp/tests/js/cutting_plan_break_only_edge.test.js
          node --test almdina_erp/tests/js/cutting_plan_print_transitions.test.js
          node almdina_erp/tests/js/offcut_plan_presentation.test.js
          node almdina_erp/tests/js/order_action_permission_guard.test.js
          node almdina_erp/tests/js/dco_workspace_asset_registry.test.js
          node --test almdina_erp/tests/js/phase3_jquery_thenable_boundaries.test.js

  pinned-desk-runtime:
    uses: ./.github/workflows/cross-order-p0-runtime.yml

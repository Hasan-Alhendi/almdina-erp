name: Stage 13 Quality Gates

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  architecture-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall -q almdina_erp

      - name: Enforce Domain dependency direction
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_domain_is_framework_free_and_depends_only_inward

      - name: Enforce Application dependency direction
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_application_is_framework_free_and_does_not_depend_on_adapters

      - name: Block fixed business-role authorization gates
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_active_authorization_does_not_reintroduce_fixed_role_gates

      - name: Keep Domain and Application free of direct Frappe persistence
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_architecture_core_never_uses_direct_sql_or_frappe_documents

      - name: Validate Stage 13 workflow contract
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_stage13_workflow_is_non_bypassable_by_default

      - name: Diagnose protected regression modules
        run: |
          python - <<'PY'
          import subprocess
          import sys

          modules = (
              "almdina_erp.tests.test_permission_matrix_application",
              "almdina_erp.tests.test_permission_custom_docperm_baseline",
              "almdina_erp.tests.test_canonical_permission_state_architecture",
              "almdina_erp.tests.test_canonical_permission_reset_patch",
              "almdina_erp.tests.test_legacy_audit_capability_migration",
              "almdina_erp.tests.test_frappe_v16_permission_hook_contract",
              "almdina_erp.tests.test_resource_permission_hooks",
              "almdina_erp.tests.test_order_edit_policy_adapter",
              "almdina_erp.tests.test_legacy_permission_bootstrap",
              "almdina_erp.tests.test_order_tab_permissions_ux",
              "almdina_erp.tests.test_routing_migration_phase",
              "almdina_erp.tests.test_shared_shell_workspace_boot_order",
              "almdina_erp.tests.test_main_workspace_administration_entry_points",
              "almdina_erp.tests.test_capability_execution_contract",
              "almdina_erp.tests.test_shop_floor_data_policy",
              "almdina_erp.tests.test_shop_floor_plan_loading_policy",
              "almdina_erp.tests.test_workforce_service_authorization_order",
              "almdina_erp.tests.test_customer_invoice_permission_surface",
              "almdina_erp.tests.test_v16_desk_navigation",
              "almdina_erp.tests.test_read_only_boot_authorization",
              "almdina_erp.tests.test_protected_order_surface_recovery",
              "almdina_erp.tests.test_frontend_consolidation_contract",
          )
          failures = []
          for module in modules:
              result = subprocess.run(
                  [sys.executable, "-m", "unittest", "-q", module],
                  text=True,
                  capture_output=True,
              )
              if result.returncode:
                  detail = " ".join((result.stderr or result.stdout).splitlines()[-4:])
                  print(f"::error title=Protected regression module failed::{module}: {detail}")
                  failures.append(module)
          if failures:
              raise SystemExit(1)
          PY

      - name: Re-run Stage 11 and Stage 12 frozen contracts
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_backend_legacy_stage11_closure \
            almdina_erp.tests.test_backend_legacy_audit_contract \
            almdina_erp.tests.test_final_security_architecture \
            almdina_erp.tests.test_stage12_security_gate

      - name: Re-run core architecture contracts
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_shop_floor_command_architecture \
            almdina_erp.tests.test_shop_floor_query_architecture \
            almdina_erp.tests.test_cutting_plan_architecture \
            almdina_erp.tests.test_order_costing_architecture \
            almdina_erp.tests.test_unified_order_controller_architecture

name: Stage 13 Quality Gates

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  architecture-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall -q almdina_erp

      - name: Inventory provisioning compatibility references
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("almdina_erp").rglob("*.py")):
              source = path.read_text(encoding="utf-8")
              matched = (
                  "application.security.provision_user" in source
                  or "from .provision_user import" in source
                  or (
                      "application.security import" in source
                      and "provision_user" in source
                  )
              )
              if matched:
                  print(f"::warning title=Provisioning compatibility reference::{path}")
          PY

      - name: Enforce Domain dependency direction
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_domain_is_framework_free_and_depends_only_inward

      - name: Enforce Application dependency direction
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_application_is_framework_free_and_does_not_depend_on_adapters

      - name: Block fixed business-role authorization gates
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_active_authorization_does_not_reintroduce_fixed_role_gates

      - name: Keep Domain and Application free of direct Frappe persistence
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_architecture_core_never_uses_direct_sql_or_frappe_documents

      - name: Validate Stage 13 workflow contract
        run: python -m unittest -v almdina_erp.tests.test_stage13_quality_gates.TestStage13QualityGates.test_stage13_workflow_is_non_bypassable_by_default

      - name: Re-run Stage 11 and Stage 12 frozen contracts
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_backend_legacy_stage11_closure \
            almdina_erp.tests.test_backend_legacy_audit_contract \
            almdina_erp.tests.test_final_security_architecture \
            almdina_erp.tests.test_stage12_security_gate

      - name: Re-run core architecture contracts
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_shop_floor_command_architecture \
            almdina_erp.tests.test_shop_floor_query_architecture \
            almdina_erp.tests.test_cutting_plan_architecture \
            almdina_erp.tests.test_order_costing_architecture \
            almdina_erp.tests.test_unified_order_controller_architecture

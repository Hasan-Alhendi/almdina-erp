name: DCO Recovery Chromium Certification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Select the Chromium certification to run
        required: true
        default: all
        type: choice
        options:
          - all
          - native_quota
          - without_native_quota

permissions:
  contents: read

jobs:
  indexeddb-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: python -m pip install pytest 'playwright>=1.50,<2'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Certify DCO recovery in Chromium
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'native_quota' && inputs.suite != 'without_native_quota')
        run: python -m pytest -q -s tests/browser/test_dco_local_recovery_chromium.py

      - name: Certify DCO recovery in Chromium without native quota case
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'without_native_quota'
        run: >-
          python -m pytest -q -s
          tests/browser/test_dco_local_recovery_chromium.py
          -k 'not test_chromium_native_origin_quota_preserves_acknowledged_checkpoint'

      - name: Certify native Chromium quota for ALMADINA-128
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'native_quota'
        run: >-
          python -m pytest -q -s
          tests/browser/test_dco_local_recovery_chromium.py::test_chromium_native_origin_quota_preserves_acknowledged_checkpoint

      - name: Upload native Chromium quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al128-native-chromium-quota-evidence
          path: ${{ runner.temp }}/al128-native-quota-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish native Chromium quota evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.suite == 'native_quota'
        env:
          QUOTA_EVIDENCE_FILE: ${{ runner.temp }}/al128-native-quota-evidence.json
        run: |
          {
            echo '### ALMADINA-128 native Chromium quota evidence'
            if [ -s "$QUOTA_EVIDENCE_FILE" ]; then
              echo '```json'
              cat "$QUOTA_EVIDENCE_FILE"
              echo '```'
            else
              echo 'No evidence file was produced; the native quota case is NOT TESTED.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

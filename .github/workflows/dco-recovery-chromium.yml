name: DCO Recovery Chromium Certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexeddb-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: python -m pip install pytest 'playwright>=1.50,<2'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Certify DCO recovery in Chromium
        run: python -m pytest -q -s tests/browser/test_dco_local_recovery_chromium.py

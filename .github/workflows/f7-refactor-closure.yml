name: F7 Frontend Refactor Closure

on:
  push:
    branches:
      - "agent/f7*"
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  frontend-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate F4 permission and production-settings JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check almdina_erp/public/js/frontend_foundation.js
          node --check almdina_erp/public/js/permission_context.js
          node --check almdina_erp/public/js/permission_action_visibility_guard.js
          node --check almdina_erp/public/js/door_cutting_order/core/door_cutting_order_document_context.js
          node --check almdina_erp/public/js/door_cutting_order/core/door_cutting_order_permission_refresh_ux.js
          node --check almdina_erp/public/js/production_routing_ux.js
          node --check almdina_erp/public/js/shop_floor_quick_actions.js
          node --check almdina_erp/tests/js/document_context.test.js

      - name: Validate F5 Shop Floor Inbox JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check almdina_erp/almdina_erp/page/shop_floor_inbox/shop_floor_inbox.js
          node --check almdina_erp/public/js/shop_floor_inbox/api.js
          node --check almdina_erp/public/js/shop_floor_inbox/state.js
          node --check almdina_erp/public/js/shop_floor_inbox/view_model.js
          node --check almdina_erp/public/js/shop_floor_inbox/renderer.js
          node --check almdina_erp/public/js/shop_floor_inbox/interactions.js
          node --check almdina_erp/public/js/shop_floor_inbox/dialogs.js
          node --check almdina_erp/public/js/shop_floor_inbox/controller.js
          node --check almdina_erp/public/js/page_revisit_refresh.js
          node --check almdina_erp/tests/js/shop_floor_inbox_view_model.test.js
          node --check almdina_erp/tests/js/project_frontend_lifecycle.test.js

      - name: Validate F6 targeted DCO JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_fast_entry_keyboard_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_measurement_lifecycle.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_bulk_rows_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_keyboard_columns_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_compact_measurements_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_measurement_actions_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_measurement_toolbar_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_measurement_resilience_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/measurements/door_cutting_order_table_performance_ux.js
          node --check almdina_erp/public/js/door_cutting_order/order_entry/edge_banding/door_cutting_order_edge_render_owner.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_content_styles.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_board_presenter.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_content_ux.js
          node --check almdina_erp/tests/js/measurement_lifecycle.test.js
          node --check almdina_erp/tests/js/plan_board_presenter.test.js
          node --check almdina_erp/tests/js/operator_edge_ownership.test.js

      - name: Run F4 lightweight architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest almdina_erp.tests.test_factory_permissions_frontend_architecture -v
          python -m unittest almdina_erp.tests.test_factory_workforce_frontend_architecture -v
          python -m unittest almdina_erp.tests.test_factory_production_settings_frontend_architecture -v

      - name: Run F5 Shop Floor Inbox architecture contracts
        run: python -m unittest almdina_erp.tests.test_shop_floor_inbox_frontend_architecture -v

      - name: Run F6 architecture and UX contracts
        shell: bash
        run: |
          python - <<'PY'
          from almdina_erp.tests import test_dco_measurement_lifecycle_architecture as lifecycle_checks
          from almdina_erp.tests import test_measurement_resilience_ux as resilience_checks
          from almdina_erp.tests import test_table_performance_ux as performance_checks
          from almdina_erp.tests import test_cutting_plan_content_architecture as plan_architecture_checks
          from almdina_erp.tests import test_cutting_plan_workspace_ux as plan_workspace_checks
          from almdina_erp.tests import test_operator_edge_ownership_architecture as ownership_checks

          modules = [
              lifecycle_checks,
              resilience_checks,
              performance_checks,
              plan_architecture_checks,
              plan_workspace_checks,
              ownership_checks,
          ]
          total = 0
          for module in modules:
              tests = [
                  getattr(module, name)
                  for name in dir(module)
                  if name.startswith("test_") and callable(getattr(module, name))
              ]
              for test in tests:
                  print(f"Running {module.__name__}.{test.__name__}...")
                  test()
              total += len(tests)
          print(f"Validated {total} F6 frontend contracts")
          PY

      - name: Run F7 closure ownership contracts
        shell: bash
        run: |
          python -m unittest almdina_erp.tests.test_frontend_refactor_closure -v
          python -m unittest almdina_erp.tests.test_project_frontend_lifecycle_contract -v

      - name: Simulate F4 document-context runtime
        run: node almdina_erp/tests/js/document_context.test.js

      - name: Simulate F5 Shop Floor Inbox view model
        run: node almdina_erp/tests/js/shop_floor_inbox_view_model.test.js

      - name: Simulate project-wide frontend lifecycle
        run: node almdina_erp/tests/js/project_frontend_lifecycle.test.js

      - name: Simulate F6 lifecycle layout and ownership helpers
        shell: bash
        run: |
          node almdina_erp/tests/js/measurement_lifecycle.test.js
          node almdina_erp/tests/js/plan_board_presenter.test.js
          node almdina_erp/tests/js/operator_edge_ownership.test.js

name: Static Checks

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static test runner
        run: python -m pip install pytest

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          errors = []
          for path in files:
              try:
                  with path.open('r', encoding='utf-8') as handle:
                      json.load(handle)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              raise SystemExit("Invalid JSON:\n" + "\n".join(errors))
          print(f"Validated {len(files)} JSON files")
          PY

      - name: Validate Python syntax
        run: python -m compileall -q almdina_erp

      - name: Run existing refactor and CI contract tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_order_editability_domain \
            almdina_erp.tests.test_order_edit_policy_adapter \
            almdina_erp.tests.test_order_revision_domain \
            almdina_erp.tests.test_order_revision_contract \
            almdina_erp.tests.test_order_revision_service_adapter \
            almdina_erp.tests.test_order_revision_activation_domain \
            almdina_erp.tests.test_order_revision_activation_adapter \
            almdina_erp.tests.test_order_revision_activation_contract \
            almdina_erp.tests.test_order_lifecycle_domain \
            almdina_erp.tests.test_order_lifecycle_permissions \
            almdina_erp.tests.test_production_authorization_domain \
            almdina_erp.tests.test_shop_floor_command_adapter \
            almdina_erp.tests.test_shop_floor_infrastructure_gateway \
            almdina_erp.tests.test_authorization_domain \
            almdina_erp.tests.test_read_only_boot_authorization \
            almdina_erp.tests.test_frappe_v16_ci_contract \
            almdina_erp.tests.test_door_cutting_order_hidden_pieces_contract

      - name: Run permission, persona, workforce, master data, and control center tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_authorization_gateway_matrix_fallback \
            almdina_erp.tests.test_permission_matrix_application \
            almdina_erp.tests.test_permission_custom_docperm_baseline \
            almdina_erp.tests.test_frappe_v16_permission_hook_contract \
            almdina_erp.tests.test_permission_management_architecture \
            almdina_erp.tests.test_permission_templates \
            almdina_erp.tests.test_permission_personas_e2e \
            almdina_erp.tests.test_final_security_architecture \
            almdina_erp.tests.test_workforce_authorization \
            almdina_erp.tests.test_workforce_management_architecture \
            almdina_erp.tests.test_factory_master_data_authorization \
            almdina_erp.tests.test_factory_master_data_architecture \
            almdina_erp.tests.test_control_center_authorization \
            almdina_erp.tests.test_control_center_architecture

      - name: Run configurable lifecycle and production architecture tests
        run: |
          python -m pytest -q \
            almdina_erp/tests/test_configurable_order_lifecycle_permissions.py \
            almdina_erp/tests/test_configurable_production_permissions.py

      - name: Run shop-floor command application tests
        run: python -m unittest -v almdina_erp.tests.test_shop_floor_command_application

      - name: Run shop-floor command architecture tests
        run: python -m unittest -v almdina_erp.tests.test_shop_floor_command_architecture

      - name: Run shop-floor query application tests
        run: python -m unittest -v almdina_erp.tests.test_shop_floor_query_application

      - name: Run shop-floor presenter tests
        run: python -m unittest -v almdina_erp.tests.test_shop_floor_presenters

      - name: Run shop-floor query architecture tests
        run: python -m unittest -v almdina_erp.tests.test_shop_floor_query_architecture

      - name: Run door-piece policy tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_order_piece_policy_domain \
            almdina_erp.tests.test_order_piece_policy_adapter

      - name: Run edge allowance and compact print tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_cut_dimensions_domain \
            almdina_erp.tests.test_cut_dimensions_architecture \
            almdina_erp.tests.test_compact_invoice_print_contract

      - name: Run plan payload and fingerprint tests
        run: python -m unittest -v almdina_erp.tests.test_order_plan_payloads

      - name: Run order costing tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_order_costing_domain \
            almdina_erp.tests.test_order_costing_architecture \
            almdina_erp.tests.test_financial_document_application

      - name: Run cutting-plan application tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_cutting_plan_application \
            almdina_erp.tests.test_cutting_plan_architecture

      - name: Run cutting-domain strategy tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_cutting_domain_strategies \
            almdina_erp.tests.test_cutting_domain_architecture

      - name: Run unified order controller tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_order_save_application \
            almdina_erp.tests.test_unified_order_controller_architecture

      - name: Enforce the no-stock product boundary
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_numeric_input_domain \
            almdina_erp.tests.test_product_scope_contract \
            almdina_erp.tests.test_replacement_planning

      - name: Run revision, board input, and typing stability regression tests
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_revision_board_input_ux_contract \
            almdina_erp.tests.test_document_context_ux_contract \
            almdina_erp.tests.test_frontend_consolidation_contract \
            almdina_erp.tests.test_input_stability_ux_contract

      - name: Run UI, DXF, invoice, and optimizer function contracts
        run: |
          python -m pytest -q \
            almdina_erp/tests/test_*ux.py \
            almdina_erp/tests/test_dxf_autocad_compatibility.py \
            almdina_erp/tests/test_arabic_operator_localization.py \
            almdina_erp/tests/test_compact_invoice_print_contract.py \
            almdina_erp/tests/test_advanced_cutting_optimizer.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find almdina_erp -type f -name '*.js' -print0)
          echo "Validated ${count} JavaScript files"

      - name: Run frontend browser simulations
        run: |
          node almdina_erp/tests/js/permission_context.test.js
          node almdina_erp/tests/js/order_lifecycle_permissions.test.js
          node almdina_erp/tests/js/financial_documents.test.js
          node almdina_erp/tests/js/cutting_plan_renderer.test.js
          node almdina_erp/tests/js/document_context.test.js
          node almdina_erp/tests/js/document_context_async.test.js
          node almdina_erp/tests/js/input_stability.test.js
          node almdina_erp/tests/js/inline_note_editor.test.js
          node almdina_erp/tests/js/sketch_interaction.test.js
          node almdina_erp/tests/js/sketch_history.test.js
          node almdina_erp/tests/js/sketch_renderer.test.js
          node almdina_erp/tests/js/shape_output_contract.test.js
          node almdina_erp/tests/js/mobile_piece_cards.test.js
          node almdina_erp/tests/js/order_list_cards.test.js
          node almdina_erp/tests/js/shop_floor_quick_actions.test.js
          node almdina_erp/tests/test_special_shape_smoothing.js
          node almdina_erp/tests/test_shape_print.js

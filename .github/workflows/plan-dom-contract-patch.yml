name: Apply focused plan DOM contract update

on:
  push:
    branches:
      - agent/fix-plan-edit-dom-ownership
    paths:
      - .github/plan-dom-contract-patch.py

permissions:
  contents: write

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plan-edit-dom-ownership
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stale ownership contract
        if: ${{ hashFiles('.github/plan-dom-contract-patch.py') != '' }}
        run: python .github/plan-dom-contract-patch.py

      - name: Validate affected contract suite
        if: ${{ hashFiles('.github/plan-dom-contract-patch.py') != '' }}
        run: python -m unittest -v almdina_erp.tests.test_frontend_consolidation_contract

      - name: Commit contract update
        if: ${{ hashFiles('.github/plan-dom-contract-patch.py') != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almdina_erp/tests/test_frontend_consolidation_contract.py
          git diff --cached --quiet || git commit -m "test(plan): align action shell ownership contract"
          git push origin HEAD:agent/fix-plan-edit-dom-ownership

name: Special Shape Documentation Checks

on:
  push:
    branches: [Develop]
    paths:
      - "almdina_erp/public/js/special_shape_documentation/**"
      - "almdina_erp/public/js/door_cutting_order/drawing/special_shape_facade.js"
      - "almdina_erp/public/js/door_cutting_order/drawing/door_cutting_order_shape_output_contract.js"
      - "almdina_erp/public/js/door_cutting_order/printing/door_cutting_order_shape_print.js"
      - "almdina_erp/public/js/door_cutting_order/costing/door_cutting_order_cost_workspace_presenter_adapter.js"
      - "almdina_erp/public/css/special_shape_documentation.css"
      - "almdina_erp/almdina_erp/page/door_drawing/**"
      - "almdina_erp/almdina_erp/services/special_shape_*"
      - "almdina_erp/tests/js/special_shape_documentation.test.js"
      - "almdina_erp/tests/js/special_price_workspace_refresh.test.js"
      - "almdina_erp/tests/js/shape_output_contract.test.js"
      - "almdina_erp/tests/test_order_piece_policy_domain.py"
      - "almdina_erp/tests/test_special_shape_documentation_*"
      - ".github/workflows/special-shape-documentation-checks.yml"
  pull_request:
    paths:
      - "almdina_erp/public/js/special_shape_documentation/**"
      - "almdina_erp/public/js/door_cutting_order/drawing/special_shape_facade.js"
      - "almdina_erp/public/js/door_cutting_order/drawing/door_cutting_order_shape_output_contract.js"
      - "almdina_erp/public/js/door_cutting_order/printing/door_cutting_order_shape_print.js"
      - "almdina_erp/public/js/door_cutting_order/costing/door_cutting_order_cost_workspace_presenter_adapter.js"
      - "almdina_erp/public/css/special_shape_documentation.css"
      - "almdina_erp/almdina_erp/page/door_drawing/**"
      - "almdina_erp/almdina_erp/services/special_shape_*"
      - "almdina_erp/tests/js/special_shape_documentation.test.js"
      - "almdina_erp/tests/js/special_price_workspace_refresh.test.js"
      - "almdina_erp/tests/js/shape_output_contract.test.js"
      - "almdina_erp/tests/test_order_piece_policy_domain.py"
      - "almdina_erp/tests/test_special_shape_documentation_*"
      - ".github/workflows/special-shape-documentation-checks.yml"

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          find almdina_erp/public/js/special_shape_documentation -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check almdina_erp/public/js/door_cutting_order/drawing/special_shape_facade.js
          node --check almdina_erp/public/js/door_cutting_order/costing/door_cutting_order_cost_workspace_presenter_adapter.js
          node --check almdina_erp/almdina_erp/page/door_drawing/door_drawing.js
          node --check almdina_erp/tests/js/special_price_workspace_refresh.test.js
      - name: Validate Python syntax and architecture
        run: |
          python -m py_compile almdina_erp/almdina_erp/services/special_shape_drawing_validation_service.py
          python -m py_compile almdina_erp/almdina_erp/services/special_shape_workspace_service.py
          python -m unittest -v almdina_erp.tests.test_order_piece_policy_domain
          python -m unittest -v almdina_erp.tests.test_special_shape_documentation_workspace_contract
          python -m unittest -v almdina_erp.tests.test_special_shape_documentation_ownership_contract
      - name: Run documentation regressions
        run: |
          node almdina_erp/tests/js/special_shape_documentation.test.js
          node almdina_erp/tests/js/special_price_workspace_refresh.test.js
          node almdina_erp/tests/js/shape_output_contract.test.js

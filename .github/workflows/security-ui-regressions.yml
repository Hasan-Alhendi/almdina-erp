name: Security and Protected UI Regressions

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  regression-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run permission and data-boundary contracts
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_permission_matrix_application \
            almdina_erp.tests.test_permission_custom_docperm_baseline \
            almdina_erp.tests.test_canonical_permission_state_architecture \
            almdina_erp.tests.test_canonical_permission_reset_patch \
            almdina_erp.tests.test_legacy_audit_capability_migration \
            almdina_erp.tests.test_frappe_v16_permission_hook_contract \
            almdina_erp.tests.test_resource_permission_hooks \
            almdina_erp.tests.test_order_edit_policy_adapter \
            almdina_erp.tests.test_legacy_permission_bootstrap \
            almdina_erp.tests.test_order_tab_permissions_ux \
            almdina_erp.tests.test_routing_migration_phase \
            almdina_erp.tests.test_shared_shell_workspace_boot_order \
            almdina_erp.tests.test_main_workspace_administration_entry_points \
            almdina_erp.tests.test_capability_execution_contract \
            almdina_erp.tests.test_shop_floor_data_policy \
            almdina_erp.tests.test_shop_floor_plan_loading_policy \
            almdina_erp.tests.test_workforce_service_authorization_order \
            almdina_erp.tests.test_customer_invoice_permission_surface \
            almdina_erp.tests.test_v16_desk_navigation \
            almdina_erp.tests.test_read_only_boot_authorization \
            almdina_erp.tests.test_protected_order_surface_recovery \
            almdina_erp.tests.test_frontend_consolidation_contract

      - name: Validate changed browser modules
        run: |
          node --check almdina_erp/public/js/permission_context.js
          node --check almdina_erp/public/js/shared_shell.js
          node --check almdina_erp/public/js/door_cutting_order/core/door_cutting_order_action_permission_guard.js
          node --check almdina_erp/public/js/door_cutting_order/costing/door_cutting_order_cost_presenter.js
          node --check almdina_erp/public/js/door_cutting_order/core/door_cutting_order_permission_refresh_ux.js
          node --check almdina_erp/public/js/door_cutting_order/core/door_cutting_order_tab_permissions_ux.js
          node --check almdina_erp/public/js/door_cutting_order/costing/door_cutting_order_customer_invoice_toolbar_ux.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_surface_bootstrap.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/secure_dxf_export.js
          node almdina_erp/tests/js/plan_surface_isolation.test.js
          node almdina_erp/tests/js/approved_plan_navigation.test.js
          node almdina_erp/tests/js/permission_context_jquery_thenable.test.js
          node almdina_erp/tests/js/order_navigation_surfaces.test.js

name: ALMADINA-162 Order Intake Contracts

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches:
      - main
      - Develop
      - develop
      - agent/almadina-161-dynamic-production-routing

permissions:
  contents: read

jobs:
  intake-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run intake lifecycle and UI contracts
        run: |
          python -m pytest -q \
            almdina_erp/tests/test_a162_intake_planning.py \
            almdina_erp/tests/test_a162_intake_planning_ui_contract.py

name: Cutting Search Report

on:
  pull_request:
    branches: [Develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: |
          python -m pip install '.[test]' playwright
          python -m playwright install --with-deps chromium
      - name: Check observation, authorization, offline UI and protected contracts
        run: |
          python -m pytest -q \
            almdina_erp/tests/test_cutting_search_report.py \
            almdina_erp/tests/test_cutting_search_report_access.py \
            almdina_erp/tests/test_cutting_search_report_browser.py \
            almdina_erp/tests/test_smart_plan_portfolio.py \
            almdina_erp/tests/test_plan_preview_session_exact_commit.py \
            almdina_erp/tests/test_a5_workspace_state_foundation.py \
            almdina_erp/tests/test_capability_execution_contract.py \
            almdina_erp/tests/test_frontend_consolidation_contract.py \
            almdina_erp/tests/test_cutting_domain_architecture.py \
            almdina_erp/tests/test_whitelisted_endpoint_authorization.py \
            almdina_erp/tests/test_permission_matrix_application.py \
            --junitxml=search-report.xml
          node almdina_erp/tests/js/cutting_search_report_api.test.js
          node almdina_erp/tests/js/plan_preview_state_ownership.test.js
          node almdina_erp/tests/js/plan_candidate_gallery.test.js
          node almdina_erp/tests/js/plan_preview_save_phase_lock.test.js
          node almdina_erp/tests/js/plan_preview_locale.test.js
      - name: Record real engine evidence and continuation
        run: |
          python scripts/benchmark_search_report.py --output /tmp/search-trace
          python scripts/benchmark_search_report.py --continuation --output /tmp/search-trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutting-search-report-evidence
          path: |
            search-report.xml
            /tmp/search-trace

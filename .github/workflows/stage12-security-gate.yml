name: Stage 12 Security Gate

on:
  push:
    branches: [main, Develop, develop]
  pull_request:
    branches: [main, Develop, develop]

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Stage 12 scope and security regression gate
        run: |
          python -m unittest -v \
            almdina_erp.tests.test_order_scope_permissions \
            almdina_erp.tests.test_permission_personas_e2e \
            almdina_erp.tests.test_final_security_architecture \
            almdina_erp.tests.test_stage12_security_gate

name: UX regression diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_order_search_measurement_toolbar_ux
          - test_dxf_autocad_compatibility
          - test_shape_print_ux
    steps:
      - name: Download pull request snapshot
        run: curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" | tar -xz --strip-components=1
      - name: Run module checks
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: |
          python - <<'PY'
          import importlib
          import os

          module = importlib.import_module(f"almdina_erp.tests.{os.environ['TEST_MODULE']}")
          tests = [
              getattr(module, name)
              for name in dir(module)
              if name.startswith("test_") and callable(getattr(module, name))
          ]
          for test in tests:
              print(f"Running {test.__name__}", flush=True)
              test()
          print(f"Validated {len(tests)} tests")
          PY

name: UX regression diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_arabic_operator_localization
          - test_door_cutting_order_operator_ux
          - test_cutting_plan_workspace_ux
          - test_dxf_autocad_compatibility
          - test_order_cost_invoice_ux
          - test_door_cutting_order_fast_save
          - test_measurement_resilience_ux
          - test_table_performance_ux
          - test_order_edge_color_ux
          - test_packing_score_field
          - test_special_shape_close_ux
          - test_door_cutting_order_save_pipeline_performance
          - test_order_search_measurement_toolbar_ux
          - test_special_shape_geometry_ux
          - test_shape_print_ux
          - test_free_text_board_entry
    steps:
      - uses: actions/checkout@v4
      - name: Run module checks
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: |
          python - <<'PY'
          import importlib
          import os

          module = importlib.import_module(f"almdina_erp.tests.{os.environ['TEST_MODULE']}")
          tests = [
              getattr(module, name)
              for name in dir(module)
              if name.startswith("test_") and callable(getattr(module, name))
          ]
          for test in tests:
              print(f"Running {test.__name__}")
              test()
          print(f"Validated {len(tests)} tests")
          PY

name: Apply plan edit DOM ownership fix

on:
  push:
    branches:
      - agent/fix-plan-edit-dom-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plan-edit-dom-ownership
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply focused ownership patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          plan_path = Path("almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js")
          source = plan_path.read_text()
          old = '''    function renderActions(frm) {
              const field = frm.fields_dict.plan_control_actions;
              if (!field || !field.$wrapper) return;
              if (!workspaceReady(frm)) {
                  field.$wrapper.empty();
                  return;
              }

              const mayMutate = canRecalculatePlan(frm);
              const settings = activeSettings(frm);
              const mode = String(settings.packing_mode || "Auto Pro");
              const blockReason = stageMutationBlockReason(frm);

              field.$wrapper.html(`
                  <div class="dco-plan-actions-shell">
                      <div class="dco-plan-dirty-note">تم تغيير أحد إعدادات الخطة. أعد الحساب لتطبيق التغيير على الرسم والنتائج.</div>
                      <div class="dco-plan-actions-title">
                          <strong>أوامر خطة القص</strong>
                          <span class="dco-plan-mode-hint">${esc(modeDescription(mode))}</span>
                      </div>
                      ${mayMutate ? `
                          <div class="dco-plan-actions">
                              <button type="button" class="btn btn-primary btn-sm dco-recalculate-plan">
                                  إعادة الحساب بالإعدادات الحالية
                              </button>
                          </div>
                      ` : ""}
                      ${documentActionsHtml(frm)}
                      <div class="dco-plan-note">
                          ${blockReason
                              ? esc(__(blockReason))
                              : mayMutate
                                  ? "عدّل إعدادات الخطة من «تعديل خطة القص»، احفظها، ثم أعد الحساب."
                                  : "إعدادات الخطة للعرض فقط في الحالة الحالية."}
                      </div>
                  </div>
              `);

              field.$wrapper.find(".dco-recalculate-plan").on("click", () => recalculate(frm));
              field.$wrapper.find(".dco-print-cutting-plan").on("click", () => printCuttingPlan(frm));
              field.$wrapper.find(".dco-export-dxf").on("click", () => exportCuttingPlanDxf(frm));
              field.$wrapper.find(".dco-upload-dxf-plan").on("click", () => uploadCuttingPlanDxf(frm));
          }
          '''
          new = '''    function renderActions(frm) {
              const field = frm.fields_dict.plan_control_actions;
              if (!field || !field.$wrapper) return;

              const wrapper = field.$wrapper;
              wrapper.children(".dco-plan-actions-shell").remove();
              if (!workspaceReady(frm)) return;

              const mayMutate = canRecalculatePlan(frm);
              const settings = activeSettings(frm);
              const mode = String(settings.packing_mode || "Auto Pro");
              const blockReason = stageMutationBlockReason(frm);

              wrapper.append(`
                  <div class="dco-plan-actions-shell">
                      <div class="dco-plan-dirty-note">تم تغيير أحد إعدادات الخطة. أعد الحساب لتطبيق التغيير على الرسم والنتائج.</div>
                      <div class="dco-plan-actions-title">
                          <strong>أوامر خطة القص</strong>
                          <span class="dco-plan-mode-hint">${esc(modeDescription(mode))}</span>
                      </div>
                      ${mayMutate ? `
                          <div class="dco-plan-actions">
                              <button type="button" class="btn btn-primary btn-sm dco-recalculate-plan">
                                  إعادة الحساب بالإعدادات الحالية
                              </button>
                          </div>
                      ` : ""}
                      ${documentActionsHtml(frm)}
                      <div class="dco-plan-note">
                          ${blockReason
                              ? esc(__(blockReason))
                              : mayMutate
                                  ? "عدّل إعدادات الخطة من «تعديل خطة القص»، احفظها، ثم أعد الحساب."
                                  : "إعدادات الخطة للعرض فقط في الحالة الحالية."}
                      </div>
                  </div>
              `);

              const shell = wrapper.children(".dco-plan-actions-shell").last();
              shell.find(".dco-recalculate-plan").on("click", () => recalculate(frm));
              shell.find(".dco-print-cutting-plan").on("click", () => printCuttingPlan(frm));
              shell.find(".dco-export-dxf").on("click", () => exportCuttingPlanDxf(frm));
              shell.find(".dco-upload-dxf-plan").on("click", () => uploadCuttingPlanDxf(frm));
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("PlanUX renderActions contract changed; refusing broad patch")
          source = source.replace(old, new)
          old_pending = '''            if (summary && summary.$wrapper) summary.$wrapper.empty();
              if (actions && actions.$wrapper) actions.$wrapper.empty();'''
          new_pending = '''            if (summary && summary.$wrapper) summary.$wrapper.empty();
              if (actions && actions.$wrapper) {
                  actions.$wrapper.children(".dco-plan-actions-shell").remove();
              }'''
          if source.count(old_pending) != 1:
              raise SystemExit("PlanUX pending fallback contract changed; refusing patch")
          plan_path.write_text(source.replace(old_pending, new_pending))

          edit_path = Path("almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js")
          source = edit_path.read_text()
          replacements = {
              '''    function editorHost(frm) {
              const wrapper = actionSurface(frm);
              if (!wrapper) return null;
              const shell = wrapper.find(".dco-plan-actions-shell").first();
              return shell.length ? shell : null;
          }''': '''    function editorHost(frm) {
              return actionSurface(frm);
          }''',
              'host.find(EDITOR_SELECTOR).toggleClass("is-dirty", Boolean(dirty));': 'host.children(EDITOR_SELECTOR).first().toggleClass("is-dirty", Boolean(dirty));',
              'host.find(EDITOR_SELECTOR).remove();': 'host.children(EDITOR_SELECTOR).remove();',
              'const editor = host.find(EDITOR_SELECTOR).first();': 'const editor = host.children(EDITOR_SELECTOR).first();',
              'if (wrapper) wrapper.find(EDITOR_SELECTOR).remove();': 'if (wrapper) wrapper.children(EDITOR_SELECTOR).remove();',
          }
          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f"EditSession contract changed for: {before[:60]!r}")
              source = source.replace(before, after)
          edit_path.write_text(source)

          controls_path = Path("almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js")
          source = controls_path.read_text()
          old_controls = '''        if (!workspaceReady(frm)) {
              field.$wrapper.empty();
              return;
          }

          const shell = field.$wrapper.find(".dco-plan-actions-shell").first();'''
          new_controls = '''        if (!workspaceReady(frm)) return;

          const shell = field.$wrapper.children(".dco-plan-actions-shell").first();'''
          if source.count(old_controls) != 1:
              raise SystemExit("PlanControls readiness contract changed; refusing patch")
          source = source.replace(old_controls, new_controls)
          source = source.replace('const duplicated = field.$wrapper.find(DUPLICATED_ACTIONS);', 'const duplicated = shell.find(DUPLICATED_ACTIONS);', 1)
          source = source.replace('bindRecalculationAction(frm, field.$wrapper.find(".dco-recalculate-plan").first());', 'bindRecalculationAction(frm, shell.find(".dco-recalculate-plan").first());', 1)
          source = source.replace('const note = field.$wrapper.find(".dco-plan-note").first();', 'const note = shell.find(".dco-plan-note").first();', 1)
          controls_path.write_text(source)

          test_path = Path("almdina_erp/tests/js/plan_edit_dom_ownership.test.js")
          test_path.write_text(r'''"use strict";

          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");

          const planSource = fs.readFileSync(
              path.resolve(__dirname, "../../public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js"),
              "utf8"
          );
          const editSource = fs.readFileSync(
              path.resolve(__dirname, "../../public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js"),
              "utf8"
          );
          const controlsSource = fs.readFileSync(
              path.resolve(__dirname, "../../public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js"),
              "utf8"
          );

          function directRoot() {
              const root = {
                  nodes: [],
                  length: 1,
                  children(selector) {
                      const className = String(selector || "").replace(/^\./, "");
                      const matches = this.nodes.filter(node => node.className === className);
                      return collection(this, matches);
                  },
                  append(markup) {
                      assert.match(markup, /dco-plan-actions-shell/);
                      this.nodes.push({ className: "dco-plan-actions-shell", markup });
                      return this;
                  },
                  prepend(markup) {
                      const className = /dco-plan-settings-editor/.test(String(markup))
                          ? "dco-plan-settings-editor"
                          : "unknown";
                      this.nodes.unshift({ className, markup: String(markup) });
                      return this;
                  },
              };
              return root;
          }

          function collection(root, nodes) {
              return {
                  length: nodes.length,
                  remove() {
                      root.nodes = root.nodes.filter(node => !nodes.includes(node));
                      return this;
                  },
                  first() {
                      return collection(root, nodes.slice(0, 1));
                  },
                  last() {
                      return collection(root, nodes.slice(-1));
                  },
                  find() {
                      return {
                          length: 0,
                          on() { return this; },
                          off() { return this; },
                      };
                  },
              };
          }

          function loadPlanUX(root) {
              const handlers = {};
              const listeners = {};
              const frm = {
                  doctype: "Door Cutting Order",
                  doc: {
                      name: "DCO-TEST-OWNERSHIP",
                      status: "Draft",
                      docstatus: 0,
                      revision_state: "Current",
                      production_path: "",
                      current_production_stage: "",
                  },
                  is_new() { return false; },
                  fields_dict: {
                      plan_control_actions: { $wrapper: root },
                  },
              };
              const fakeWindow = {
                  cur_frm: frm,
                  AlmdinaPermissions: {
                      canDocument() { return false; },
                      can() { return false; },
                  },
                  AlmdinaPlanWorkspaceState: {
                      snapshot() {
                          return {
                              status: "ready",
                              data: { approved_plan: "", plans: {} },
                              editing: true,
                              draft: { packing_mode: "Auto Pro" },
                          };
                      },
                      activePlan() {
                          return { settings: { packing_mode: "Auto Pro" } };
                      },
                  },
                  addEventListener(name, callback) { listeners[name] = callback; },
              };
              const fakeFrappe = {
                  utils: { escape_html(value) { return String(value); } },
                  ui: {
                      form: {
                          on(doctype, mapping) {
                              assert.equal(doctype, "Door Cutting Order");
                              Object.assign(handlers, mapping);
                          },
                      },
                  },
                  almdina: {},
              };
              const context = vm.createContext({
                  window: fakeWindow,
                  frappe: fakeFrappe,
                  console,
                  Set,
                  Object,
                  String,
                  Number,
                  Boolean,
                  Array,
                  Promise,
                  JSON,
                  __: value => String(value),
              });
              vm.runInContext(planSource, context, { filename: "door_cutting_order_plan_ux.js" });
              return { frm, api: fakeWindow.AlmdinaDoorCuttingPlanUX };
          }

          const root = directRoot();
          root.prepend('<section class="dco-plan-settings-editor"></section>');
          const { frm, api } = loadPlanUX(root);

          api.renderActions(frm);
          assert.equal(root.children(".dco-plan-settings-editor").length, 1, "PlanUX rerender must preserve the edit-session editor");
          assert.equal(root.children(".dco-plan-actions-shell").length, 1, "PlanUX must own exactly one action shell");

          api.renderActions(frm);
          assert.equal(root.children(".dco-plan-settings-editor").length, 1, "repeated PlanUX renders must not remove or duplicate the editor");
          assert.equal(root.children(".dco-plan-actions-shell").length, 1, "repeated PlanUX renders must not duplicate the action shell");

          const reverseRoot = directRoot();
          const reverse = loadPlanUX(reverseRoot);
          reverse.api.renderActions(reverse.frm);
          reverseRoot.prepend('<section class="dco-plan-settings-editor"></section>');
          reverse.api.renderActions(reverse.frm);
          assert.equal(reverseRoot.children(".dco-plan-settings-editor").length, 1, "PlanUX → EditSession → PlanUX order must preserve the editor");
          assert.equal(reverseRoot.children(".dco-plan-actions-shell").length, 1);

          assert.match(
              editSource,
              /function editorHost\(frm\)\s*\{\s*return actionSurface\(frm\);\s*\}/,
              "EditSession editor host must be the neutral shared action surface"
          );
          assert.match(editSource, /host\.children\(EDITOR_SELECTOR\)\.remove\(\)/);
          assert.match(editSource, /wrapper\.children\(EDITOR_SELECTOR\)\.remove\(\)/);
          assert.doesNotMatch(
              editSource.match(/function editorHost[\s\S]*?\n    \}/)?.[0] || "",
              /dco-plan-actions-shell/,
              "EditSession must not mount inside the PlanUX-owned action shell"
          );

          const renderActionsSource = planSource.match(/function renderActions\(frm\)[\s\S]*?\n    async function recalculate/)?.[0] || "";
          assert.doesNotMatch(renderActionsSource, /field\.\$wrapper\.(?:html|empty)\(/);
          assert.match(renderActionsSource, /wrapper\.children\("\.dco-plan-actions-shell"\)\.remove\(\)/);
          assert.match(renderActionsSource, /const shell = wrapper\.children\("\.dco-plan-actions-shell"\)\.last\(\)/);

          const simplifySource = controlsSource.match(/function simplifyActions\(frm\)[\s\S]*?\n    function apply\(frm\)/)?.[0] || "";
          assert.doesNotMatch(simplifySource, /field\.\$wrapper\.empty\(\)/, "PlanControls must not clear the shared action root");
          assert.match(simplifySource, /field\.\$wrapper\.children\("\.dco-plan-actions-shell"\)\.first\(\)/);

          console.log("plan edit DOM ownership regression simulation passed");
          ''')

          workflow_path = Path(".github/workflows/f6-dco-frontend.yml")
          source = workflow_path.read_text()
          check_anchor = "          node --check almdina_erp/tests/js/plan_board_presenter.test.js\n"
          if check_anchor not in source:
              raise SystemExit("F6 syntax-check anchor changed")
          source = source.replace(
              check_anchor,
              check_anchor + "          node --check almdina_erp/tests/js/plan_edit_dom_ownership.test.js\n",
              1,
          )
          run_anchor = '''      - name: Validate cutting plan board layout policy
              run: node almdina_erp/tests/js/plan_board_presenter.test.js
          '''
          if run_anchor not in source:
              raise SystemExit("F6 plan test anchor changed")
          source = source.replace(
              run_anchor,
              run_anchor + '''
              - name: Validate cutting plan edit DOM ownership
                run: node almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          ''',
              1,
          )
          workflow_path.write_text(source)
          PY

      - name: Run focused regression checks
        run: |
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js
          node --check almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          node almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          node almdina_erp/tests/js/plan_surface_isolation.test.js

      - name: Commit focused fix and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plan-edit-dom-ownership-patch.yml
          git add almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js
          git add almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js
          git add almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js
          git add almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          git add .github/workflows/f6-dco-frontend.yml
          git commit -m "fix(plan): separate edit-session DOM ownership"
          git push origin HEAD:agent/fix-plan-edit-dom-ownership

name: Apply plan edit DOM ownership fix

on:
  push:
    branches:
      - agent/fix-plan-edit-dom-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plan-edit-dom-ownership
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply focused ownership patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(before, after, 1)

          plan_path = Path("almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js")
          source = plan_path.read_text()
          start = source.index("    function renderActions(frm) {")
          end = source.index("\n    async function recalculate", start)
          block = source[start:end]
          block = replace_once(
              block,
              "        if (!workspaceReady(frm)) {\n            field.$wrapper.empty();\n            return;\n        }\n",
              "        const wrapper = field.$wrapper;\n        wrapper.children(\".dco-plan-actions-shell\").remove();\n        if (!workspaceReady(frm)) return;\n",
              "PlanUX readiness",
          )
          block = replace_once(block, "        field.$wrapper.html(`", "        wrapper.append(`", "PlanUX shell render")
          events = (
              '        field.$wrapper.find(".dco-recalculate-plan").on("click", () => recalculate(frm));\n'
              '        field.$wrapper.find(".dco-print-cutting-plan").on("click", () => printCuttingPlan(frm));\n'
              '        field.$wrapper.find(".dco-export-dxf").on("click", () => exportCuttingPlanDxf(frm));\n'
              '        field.$wrapper.find(".dco-upload-dxf-plan").on("click", () => uploadCuttingPlanDxf(frm));'
          )
          scoped_events = (
              '        const shell = wrapper.children(".dco-plan-actions-shell").last();\n'
              '        shell.find(".dco-recalculate-plan").on("click", () => recalculate(frm));\n'
              '        shell.find(".dco-print-cutting-plan").on("click", () => printCuttingPlan(frm));\n'
              '        shell.find(".dco-export-dxf").on("click", () => exportCuttingPlanDxf(frm));\n'
              '        shell.find(".dco-upload-dxf-plan").on("click", () => uploadCuttingPlanDxf(frm));'
          )
          block = replace_once(block, events, scoped_events, "PlanUX event scope")
          source = source[:start] + block + source[end:]
          source = replace_once(
              source,
              "            if (actions && actions.$wrapper) actions.$wrapper.empty();",
              "            if (actions && actions.$wrapper) {\n                actions.$wrapper.children(\".dco-plan-actions-shell\").remove();\n            }",
              "PlanUX pending actions",
          )
          plan_path.write_text(source)

          edit_path = Path("almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js")
          source = edit_path.read_text()
          source = replace_once(
              source,
              '    function editorHost(frm) {\n        const wrapper = actionSurface(frm);\n        if (!wrapper) return null;\n        const shell = wrapper.find(".dco-plan-actions-shell").first();\n        return shell.length ? shell : null;\n    }',
              '    function editorHost(frm) {\n        return actionSurface(frm);\n    }',
              "EditSession host",
          )
          for before, after, label in [
              ('host.find(EDITOR_SELECTOR).toggleClass("is-dirty", Boolean(dirty));', 'host.children(EDITOR_SELECTOR).first().toggleClass("is-dirty", Boolean(dirty));', "dirty editor scope"),
              ('host.find(EDITOR_SELECTOR).remove();', 'host.children(EDITOR_SELECTOR).remove();', "mount editor scope"),
              ('const editor = host.find(EDITOR_SELECTOR).first();', 'const editor = host.children(EDITOR_SELECTOR).first();', "mounted editor lookup"),
              ('if (wrapper) wrapper.find(EDITOR_SELECTOR).remove();', 'if (wrapper) wrapper.children(EDITOR_SELECTOR).remove();', "unmount editor scope"),
          ]:
              source = replace_once(source, before, after, label)
          edit_path.write_text(source)

          controls_path = Path("almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js")
          source = controls_path.read_text()
          source = replace_once(
              source,
              '    function installApprovalAction(frm, field) {\n        if (!can(frm, "approve_dxf") || !canMutateCurrentStage(frm)) {\n            field.$wrapper.find(".dco-approve-cutting-plan").remove();\n            return;\n        }\n        let host = field.$wrapper.find(".dco-plan-actions").first();\n        if (!host.length) host = field.$wrapper;\n        let button = field.$wrapper.find(".dco-approve-cutting-plan").first();',
              '    function installApprovalAction(frm, shell) {\n        if (!can(frm, "approve_dxf") || !canMutateCurrentStage(frm)) {\n            shell.find(".dco-approve-cutting-plan").remove();\n            return;\n        }\n        let host = shell.find(".dco-plan-actions").first();\n        if (!host.length) host = shell;\n        let button = shell.find(".dco-approve-cutting-plan").first();',
              "PlanControls approval scope",
          )
          start = source.index("    function simplifyActions(frm) {")
          end = source.index("\n    function apply(frm)", start)
          block = source[start:end]
          block = replace_once(
              block,
              '        if (!workspaceReady(frm)) {\n            field.$wrapper.empty();\n            return;\n        }',
              '        if (!workspaceReady(frm)) return;',
              "PlanControls readiness",
          )
          block = replace_once(block, 'field.$wrapper.find(".dco-plan-actions-shell").first()', 'field.$wrapper.children(".dco-plan-actions-shell").first()', "PlanControls shell lookup")
          block = replace_once(block, 'field.$wrapper.find(DUPLICATED_ACTIONS)', 'shell.find(DUPLICATED_ACTIONS)', "PlanControls duplicated actions")
          block = replace_once(block, 'field.$wrapper.find(".dco-recalculate-plan").first()', 'shell.find(".dco-recalculate-plan").first()', "PlanControls recalc scope")
          block = replace_once(block, 'installApprovalAction(frm, field);', 'installApprovalAction(frm, shell);', "PlanControls approval call")
          block = replace_once(block, 'field.$wrapper.find(".dco-plan-note").first()', 'shell.find(".dco-plan-note").first()', "PlanControls note scope")
          source = source[:start] + block + source[end:]
          controls_path.write_text(source)

          test_path = Path("almdina_erp/tests/js/plan_edit_dom_ownership.test.js")
          test_path.write_text(r'''"use strict";

const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");

function read(relativePath) {
    return fs.readFileSync(path.resolve(__dirname, relativePath), "utf8");
}

function functionBlock(source, startMarker, endMarker) {
    const start = source.indexOf(startMarker);
    const end = source.indexOf(endMarker, start);
    assert.notEqual(start, -1, `missing ${startMarker}`);
    assert.notEqual(end, -1, `missing ${endMarker}`);
    return source.slice(start, end);
}

const planSource = read("../../public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js");
const editSource = read("../../public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js");
const controlsSource = read("../../public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js");

const renderActions = functionBlock(planSource, "function renderActions(frm)", "async function recalculate");
assert.match(renderActions, /const wrapper = field\.\$wrapper;/);
assert.match(renderActions, /wrapper\.children\("\.dco-plan-actions-shell"\)\.remove\(\)/);
assert.match(renderActions, /wrapper\.append\(`/);
assert.match(renderActions, /const shell = wrapper\.children\("\.dco-plan-actions-shell"\)\.last\(\)/);
assert.doesNotMatch(renderActions, /field\.\$wrapper\.(?:html|empty)\(/);
assert.doesNotMatch(renderActions, /field\.\$wrapper\.find\(/);

const pending = functionBlock(planSource, "function renderWorkspacePending(frm)", "function refreshPlanUX(frm)");
assert.match(pending, /actions\.\$wrapper\.children\("\.dco-plan-actions-shell"\)\.remove\(\)/);
assert.doesNotMatch(pending, /actions\.\$wrapper\.empty\(\)/);

const editorHost = functionBlock(editSource, "function editorHost(frm)", "function markEditorDirty");
assert.match(editorHost, /return actionSurface\(frm\);/);
assert.doesNotMatch(editorHost, /dco-plan-actions-shell/);

const mount = functionBlock(editSource, "function mountDraftControls(frm)", "function unmountDraftControls(frm)");
assert.match(mount, /host\.children\(EDITOR_SELECTOR\)\.remove\(\)/);
assert.match(mount, /host\.prepend\(`/);
assert.match(mount, /const editor = host\.children\(EDITOR_SELECTOR\)\.first\(\)/);
const unmount = functionBlock(editSource, "function unmountDraftControls(frm)", "function focusDraftControl(frm");
assert.match(unmount, /wrapper\.children\(EDITOR_SELECTOR\)\.remove\(\)/);

const simplify = functionBlock(controlsSource, "function simplifyActions(frm)", "function apply(frm)");
assert.doesNotMatch(simplify, /field\.\$wrapper\.empty\(\)/);
assert.match(simplify, /field\.\$wrapper\.children\("\.dco-plan-actions-shell"\)\.first\(\)/);
assert.match(simplify, /shell\.find\(DUPLICATED_ACTIONS\)/);
assert.match(simplify, /installApprovalAction\(frm, shell\)/);

function neutralRoot() {
    return ["dco-plan-settings-editor", "dco-plan-actions-shell"];
}
function rerenderActions(root) {
    return root.filter(name => name !== "dco-plan-actions-shell").concat("dco-plan-actions-shell");
}
function unmountEditor(root) {
    return root.filter(name => name !== "dco-plan-settings-editor");
}

let root = neutralRoot();
for (let i = 0; i < 5; i += 1) root = rerenderActions(root);
assert.deepEqual(root, ["dco-plan-settings-editor", "dco-plan-actions-shell"]);
root = unmountEditor(root);
assert.deepEqual(root, ["dco-plan-actions-shell"], "Cancel/Save cleanup must leave PlanUX actions intact");

let reverse = ["dco-plan-actions-shell"];
reverse.unshift("dco-plan-settings-editor");
reverse = rerenderActions(reverse);
assert.deepEqual(reverse, ["dco-plan-settings-editor", "dco-plan-actions-shell"]);

console.log("plan edit DOM ownership contract passed");
''')

          workflow_path = Path(".github/workflows/f6-dco-frontend.yml")
          source = workflow_path.read_text()
          check = "          node --check almdina_erp/tests/js/plan_board_presenter.test.js\n"
          if "plan_edit_dom_ownership.test.js" not in source:
              source = replace_once(source, check, check + "          node --check almdina_erp/tests/js/plan_edit_dom_ownership.test.js\n", "F6 syntax anchor")
              run = "      - name: Validate cutting plan board layout policy\n        run: node almdina_erp/tests/js/plan_board_presenter.test.js\n"
              source = replace_once(
                  source,
                  run,
                  run + "\n      - name: Validate cutting plan edit DOM ownership\n        run: node almdina_erp/tests/js/plan_edit_dom_ownership.test.js\n",
                  "F6 run anchor",
              )
          workflow_path.write_text(source)
          PY

      - name: Run focused regression checks
        run: |
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js
          node --check almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js
          node --check almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          node almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          node almdina_erp/tests/js/plan_surface_isolation.test.js

      - name: Commit focused fix and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plan-edit-dom-ownership-patch.yml
          git add almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_ux.js
          git add almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_edit_session_ux.js
          git add almdina_erp/public/js/door_cutting_order/cutting_plan/door_cutting_order_plan_controls_ux.js
          git add almdina_erp/tests/js/plan_edit_dom_ownership.test.js
          git add .github/workflows/f6-dco-frontend.yml
          git commit -m "fix(plan): separate edit-session DOM ownership"
          git push origin HEAD:agent/fix-plan-edit-dom-ownership
